apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.name }}"
  # Optional Kuiper annotations. Uncomment to enable — see AGENTS.md for the full reference.
  #
  # Surface connection details (e.g. credentials) in the Hubble UI endpoint list.
  # Only advertise a port this Service exposes and the NetworkPolicy admits. The app port is
  # neither, so add a direct-connect port to both before listing it here.
  # annotations:
  #   kuiper.juno-innovations.com/connection: "username=admin"
spec:
  selector:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
  ports:
    # Route through the nginx sidecar, which enforces the Hubble login.
    # The application port stays unexposed.
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
