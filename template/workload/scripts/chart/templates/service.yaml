apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.name }}"
  # Optional Kuiper annotations. Uncomment to enable — see AGENTS.md for the full reference.
  #
  # Surface connection details (e.g. credentials, ports) in the Hubble UI endpoint list.
  # annotations:
  #   kuiper.juno-innovations.com/connection: "username=admin,port={{ .Values.port }}"
spec:
  selector:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP