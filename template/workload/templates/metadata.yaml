apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-terra-metadata"
  labels:
    # This label tells Genesis to include this plugin in the workload template catalog.
    # The value must point to the scripts ConfigMap for this release.
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    # Categorizes this workload in the Genesis UI workload table.
    # Valid values: Application | Terminal | Workspace | Server | Virtual Machine
    juno-innovations.com/workload: "WORKLOAD_TYPE"
data:
  # Must point to the scripts ConfigMap — Genesis reads packaged_scripts.base64 from it.
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "PLUGIN workload template"
  # The fields schema drives the Genesis workload-creation UI.
  # Every field here becomes a Helm value passed into scripts/chart/ by Kuiper at launch time.
  # See docs/plugin-fields.md for the full type reference.
  fields: |
    - name: icon
      default: ""
    - name: registry
      description: "Container registry"
      type: string
      required: true
      default: "docker.io"
    - name: repo
      description: "Image repository"
      type: string
      required: true
      default: "PLUGIN"
    - name: tag
      description: "Image tag"
      type: string
      required: true
      default: "latest"
    - name: publicAccess
      description: "Allow public access (disable authentication)"
      type: boolean
      required: true
      default: false
  # TODO: List commonly used custom environment variables for the upstream image.
  # Remove any that conflict with vars already set by the platform at runtime
  # (JUNO_WORKSTATION, JUNO_PROJECT, JUNO_ENVIRONMENT, USER, HOME, UID, GID, PREFIX —
  # see concepts/env.md). Leave as an empty list (env_hints: |\n    []) if the image
  # has no commonly used custom env vars.
  # Platform vars (JUNO_*, USER, HOME, UID, GID, PREFIX) are pass-through only — wire
  # them into workload.yaml solely when the upstream image is built to read them (concepts/env.md).
  env_hints: |
    - name: TODO_VAR_NAME
      description: TODO — what this variable does and when to set it.
