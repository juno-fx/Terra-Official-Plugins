apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-network-policy
  labels:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Release.Name }}"
spec:
  podSelector:
    matchLabels:
      kuiper.juno-innovations.com/kuiper-instance: "{{ .Release.Name }}"
  # Egress is intentionally unrestricted: the boot script runs `apt-get update`/
  # `apt-get install` on every pod start (over plain HTTP, not HTTPS — Debian
  # mirrors don't use TLS), and this is an interactive coding terminal where
  # users run arbitrary package installs (apt/npm/pip/curl/etc.) against
  # arbitrary hosts and ports. Enumerating an egress allowlist isn't practical
  # here; only Ingress is restricted.
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingressNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: {{ .Values.ttyd_port }}
