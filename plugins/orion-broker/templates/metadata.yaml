apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-terra-metadata"
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Server"  # mark this as a workload and it's type for the frontend UI
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "Orion connection broker proxy for externally managed infrastructure"
  fields: |
    - name: icon
      description: "Icon for the workload"
      type: string
      required: false
      default: https://raw.githubusercontent.com/juno-fx/Terra-Official-Plugins/refs/heads/main/plugins/orion-broker/assets/logo.png
    - name: ip
      description: "IP address of the externally managed backend running the Orion broker (single address for now)"
      type: string
      required: true
    - name: ports
      description: Ports to expose from the externally managed backend.
      required: false
      type: list
      fields:
        - name: name
          description: Name of the port
          required: true
          type: string
          default: port
        - name: service_port
          description: Port number to expose outside the backend
          required: true
          default: 443
          type: int
        - name: protocol
          description: Protocol for the port
          required: true
          type: select
          default: TCP
          options:
            - TCP
            - UDP
  # The plugin exposes no user-configurable env vars beyond the platform-set ones.
  env_hints: |
    []