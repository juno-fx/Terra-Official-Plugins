resource_id: amd-gpu-operator
name: AMD GPU Operator
icon: https://raw.githubusercontent.com/juno-fx/Terra-Official-Plugins/refs/heads/main/plugins/amd-gpu-operator/assets/logo.png
description: |
  Enable GPU acceleration for compute workloads on AMD Instinct and Radeon GPUs. https://instinct.docs.amd.com/projects/gpu-operator
category: Hardware
tags:
  - gpu
  - amd
  - operator
  - cluster-level
editable: true
fields:
  - name: version
    description: Version of the AMD GPU Operator to install.
    required: true
    default: v1.5.1
    type: select
    options:
      - v1.5.1
      - v1.5.0
      - v1.4.1
  - name: helm_repo
    description: Helm repository URL for the AMD GPU Operator chart.
    required: true
    default: "https://rocm.github.io/gpu-operator"
    type: string
  - name: install_nfd
    description: |
      Install Node Feature Discovery (NFD) with the operator. NFD labels the GPU nodes,
      which is how the operator finds them. On by default. A cluster should have only one
      NFD install: if the NVIDIA GPU Operator plugin (or anything else) already installs
      NFD, turn this off, or the two collide over the shared NFD CRDs. The plugin that
      installs NFD must be uninstalled last.
    required: false
    default: true
    type: boolean
  - name: detect_all_gpus
    description: |
      Which nodes count as AMD GPU nodes. On labels any node with an AMD GPU, integrated
      GPUs and unlisted cards included (Ryzen AI, Strix Halo). Off labels only AMD's
      supported list (Instinct, Radeon Pro, selected Radeon RX); other nodes then need the
      amd-gpu label added by hand. Labelling alone does not make GPUs schedulable.
    required: false
    default: true
    type: boolean
  - name: vgpu_nodes
    description: |
      Target nodes labelled amd-vgpu instead of amd-gpu. Turn on when the nodes are virtual
      machines that see an AMD GPU virtual function rather than the physical device.
    required: false
    default: false
    type: boolean
  - name: device_plugin
    description: |
      Make the GPUs on labelled nodes schedulable as amd.com/gpu. Turn off to hand that job
      to a third-party installed GPU scheduler like HAMi, which brings its own device plugin.
      Node labelling and the metrics exporter keep running.
    required: false
    default: true
    type: boolean
