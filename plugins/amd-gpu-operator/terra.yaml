resource_id: amd-gpu-operator
name: AMD GPU Operator
icon: https://raw.githubusercontent.com/juno-fx/Terra-Official-Plugins/refs/heads/main/plugins/amd-gpu-operator/assets/logo.png
description: |
  Enable GPU acceleration for compute workloads on AMD Instinct and Radeon GPUs. https://instinct.docs.amd.com/projects/gpu-operator
category: Hardware
tags:
  - gpu
  - amd
  - operator
  - cluster-level
editable: true
fields:
  - name: version
    description: Version of the AMD GPU Operator to install.
    required: true
    default: v1.5.1
    type: select
    options:
      - v1.5.1
      - v1.5.0
      - v1.4.1
  - name: helm_repo
    description: Helm repository URL for the AMD GPU Operator chart.
    required: true
    default: "https://rocm.github.io/gpu-operator"
    type: string
  - name: install_nfd
    description: |
      Install Node Feature Discovery (NFD) with the operator. NFD labels the GPU nodes,
      which is how the operator finds them. A cluster should have only one NFD install: off
      by default because the NVIDIA GPU Operator plugin already installs it. Turn on only
      when nothing else provides NFD. The plugin that installs NFD must be uninstalled last.
    required: false
    default: false
    type: boolean
  - name: detect_all_gpus
    description: |
      Label every node with an AMD GPU, including integrated GPUs and cards outside AMD's
      supported list (Ryzen AI, Strix Halo). Off labels only Instinct, Radeon Pro and
      selected Radeon RX; other nodes then need the amd-gpu label added by hand.
    required: false
    default: true
    type: boolean
  - name: vgpu_nodes
    description: |
      Target nodes labelled amd-vgpu instead of amd-gpu. Turn on when the nodes are virtual
      machines that see an AMD GPU virtual function rather than the physical device.
    required: false
    default: false
    type: boolean
  - name: device_plugin
    description: |
      Run the operator's own device plugin, which advertises amd.com/gpu. Turn off before
      enabling AMD in the HAMi plugin, which brings its own. Node labelling and the metrics
      exporter keep running.
    required: false
    default: true
    type: boolean
