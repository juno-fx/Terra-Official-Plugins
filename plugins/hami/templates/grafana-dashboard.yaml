# Grafana picks this up through the kube-prometheus-stack dashboard sidecar, which
# watches every namespace for ConfigMaps labelled grafana_dashboard=1. The JSON is
# kept as a plain file (dashboards/hami-gpu.json) because Grafana legend templates
# use the same double-brace syntax as Helm and would otherwise fail to render.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  hami-gpu-sharing.json: |-
{{ .Files.Get "dashboards/hami-gpu.json" | indent 4 }}
