{{- $amd := eq (toString .Values.enable_amd) "true" -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-hami
  namespace: {{ .Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    # Upstream default; HAMi's docs, the WebUI chart and the AMD plugin all assume it.
    namespace: kube-system
  source:
    repoURL: {{ .Values.helm_repo }}
    chart: hami
    targetRevision: {{ .Values.version | quote }}
    helm:
      releaseName: hami
      values: |
        scheduler:
          # kubeScheduler.image.tag is left empty on purpose: the chart derives it from
          # the cluster's Kubernetes version.
          defaultSchedulerPolicy:
            nodeSchedulerPolicy: {{ .Values.scheduler_node_policy }}
            gpuSchedulerPolicy: {{ .Values.scheduler_gpu_policy }}
        devicePlugin:
          # Run on exactly the nodes where the NVIDIA GPU Operator would run its own
          # device plugin. Skips nodes in vm-passthrough mode. null drops the chart's
          # default gpu=on key so no manual node labelling is needed.
          nvidiaNodeSelector:
            gpu: null
            nvidia.com/gpu.deploy.device-plugin: "true"
          # Wait for the GPU Operator's container toolkit before starting.
          gpuOperatorToolkitReady:
            enabled: true
          # The GPU Operator (v25.3+) runs the nvidia runtime in CDI mode, where the
          # legacy NVIDIA_VISIBLE_DEVICES env resolves against a management CDI spec
          # that has no per-GPU entries. A CDI strategy injects HAMi's own spec instead.
          deviceListStrategy: {{ .Values.device_list_strategy }}
          # The chart defaults to a NodePort for the metrics service.
          service:
            type: ClusterIP
        devices:
          nvidia:
            # RuntimeClass created by the GPU Operator's container toolkit.
            runtimeClassName: nvidia
            deviceSplitCount: {{ .Values.device_split_count }}
            deviceMemoryScaling: {{ .Values.device_memory_scaling }}
            deviceCoreScaling: {{ .Values.device_core_scaling }}
            defaultMemory: {{ .Values.default_gpu_memory }}
            preConfiguredDeviceMemory: {{ .Values.preconfigured_gpu_memory }}
          {{- if not $amd }}
          # The chart enables AMD handling by default: any pod requesting amd.com/gpu is
          # moved onto hami-scheduler, which without the AMD device plugin has no AMD device
          # registered and leaves the pod unschedulable ("node unregistered"). Blank names
          # make the webhook ignore AMD requests, so they stay on the default scheduler and
          # the AMD GPU Operator's own device plugin.
          # resourceMemoryPercentageName must stay set: the chart copies it into the
          # kube-scheduler extender's managedResources, where an empty name is rejected and
          # crash-loops the scheduler. Nothing requests it, so it never matches a pod.
          amd:
            resourceCountName: ""
            resourceMemoryName: ""
            resourceCoreName: ""
            customresources: []
          {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-hami-webui
  namespace: {{ .Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: {{ .Values.webui_git_repo }}
    path: charts/hami-webui
    targetRevision: {{ .Values.webui_git_revision | quote }}
    helm:
      releaseName: hami-webui
      values: |
        # The dashboard reads everything from Prometheus; it never talks to HAMi directly.
        externalPrometheus:
          enabled: true
          address: {{ .Values.prometheus_url | quote }}
        kube-prometheus-stack:
          enabled: false
        # The GPU Operator already runs a DCGM exporter on the GPU nodes.
        dcgm-exporter:
          enabled: false
        hamiServiceMonitor:
          enabled: true
          svcNamespace: kube-system
          {{- with .Values.prometheus_release_label }}
          additionalLabels:
            release: {{ . | quote }}
          {{- end }}
        serviceMonitor:
          enabled: true
          {{- with .Values.prometheus_release_label }}
          additionalLabels:
            release: {{ . | quote }}
          {{- end }}
        # Same node set as the HAMi device plugin above.
        vendorNodeSelectors:
          NVIDIA: nvidia.com/gpu.deploy.device-plugin=true
        frontend:
          # Serve the SPA, its assets and API under the Ingress prefix.
          basePath: {{ .Values.prefix | quote }}
          # Genesis embeds the dashboard in an iFrame on the same host.
          frameAncestors: ["'self'"]
        # The dashboard has no login of its own, so the Ingress sits behind Genesis auth.
        ingress:
          enabled: true
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/auth-url: "http://genesis.{{ .Release.Namespace }}.svc.cluster.local:3000/api/auth-service/{{ .Release.Name }}/"
            nginx.ingress.kubernetes.io/auth-signin: /unauthorized/
          hosts:
            - host: {{ .Values.host | quote }}
              paths:
                - path: {{ .Values.prefix | quote }}
                  pathType: Prefix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
{{- if $amd }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-hami-amd
  namespace: {{ .Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: {{ .Values.amd_plugin_git_repo }}
    path: helm/amd-gpu
    targetRevision: {{ .Values.amd_plugin_git_revision | quote }}
    helm:
      releaseName: hami-amd
      values: |
        dp:
          # Same sharing limits as the NVIDIA side. 0 would let the plugin pick per GPU.
          splitCount: {{ .Values.device_split_count }}
          deviceMemoryScaling: {{ .Values.device_memory_scaling }}
        # Only nodes the AMD GPU Operator has recognised. Its NFD rule sets this label;
        # the chart's default selector needs a PCI-class NFD label this cluster lacks.
        node_selector_enabled: true
        node_selector:
          feature.node.kubernetes.io/amd-gpu: "true"
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
          - key: amd.com/gpu
            operator: Exists
            effect: NoSchedule
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
{{- end }}
