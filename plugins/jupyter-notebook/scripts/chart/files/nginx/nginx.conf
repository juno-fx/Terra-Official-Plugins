server {
    listen 8080;
    listen [::]:8080;
    # Match Jupyter's default max_body_size (nginx's 1m default would reject uploads).
    client_max_body_size 512m;
    location = /{{ .Release.Namespace }}/jupyter/{{ .Values.name }} {
        rewrite ^ /{{ .Release.Namespace }}/jupyter/{{ .Values.name }}/ last;
    }

    location /{{ .Release.Namespace }}/jupyter/{{ .Values.name }}/ {
        auth_request /auth;
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth {
        internal;
        proxy_pass http://hubble.{{ .Release.Namespace }}.svc.cluster.local:3000/api/auth-workstation/{{ .Values.name }}/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
}
