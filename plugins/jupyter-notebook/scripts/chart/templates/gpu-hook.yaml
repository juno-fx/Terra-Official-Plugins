{{- $gpu := .Values.gpu -}}
{{- if kindIs "slice" $gpu -}}
{{- else if has (toString $gpu) (list "true" "false" "" "<nil>") -}}
{{- $gpu = ternary (list "nvidia") (list) (eq (toString $gpu) "true") -}}
{{- else -}}
{{- $gpu = splitList "," (toString $gpu) -}}
{{- end -}}
{{- if has "amd" $gpu }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.name }}-gpu-hook"
data:
  # Sourced by the Jupyter docker-stacks start.sh (before-notebook.d) as root, before it
  # switches to NB_USER. GPU device nodes injected via CDI arrive root:root 0660 (containerd
  # default) or with a host group (video / render). Both are unreadable by NB_USER, so
  # root-group nodes are opened up (the container's /dev is a private tmpfs, so this does
  # not touch the host) and host-group nodes get NB_USER added to that group.
  10-gpu-device-groups.sh: |
    #!/bin/bash
    for dev in /dev/kfd /dev/dri/card* /dev/dri/renderD*; do
      [ -e "$dev" ] || continue
      gid=$(stat -c %g "$dev")
      if [ "$gid" = "0" ]; then
        chmod 0666 "$dev" && echo "gpu-hook: chmod 0666 $dev (owned by root)"
        continue
      fi
      getent group "$gid" >/dev/null 2>&1 || groupadd -g "$gid" "gpu-$gid"
      usermod -aG "$gid" "${NB_USER}" && echo "gpu-hook: added ${NB_USER} to gid $gid for $dev"
    done
{{- end }}
