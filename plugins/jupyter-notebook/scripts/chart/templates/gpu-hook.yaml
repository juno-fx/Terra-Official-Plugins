{{- if eq (toString .Values.gpu) "amd" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.name }}-gpu-hook"
data:
  # Sourced by the Jupyter docker-stacks start.sh (before-notebook.d) as root, before it
  # switches to NB_USER. The GPU device nodes the AMD device plugin injects arrive either
  # root:root 0660 or with a host group (video / render). Both are unreadable by NB_USER, so
  # root-group nodes are opened up (the container's /dev is a private tmpfs, so this does
  # not touch the host) and host-group nodes get NB_USER added to that group.
  10-gpu-device-groups.sh: |
    #!/bin/bash
    # HAMi's AMD memory hook (libamvgpu.so) is injected as LD_AUDIT in the pod env. The
    # docker-stacks start script switches to NB_USER through `sudo --preserve-env`, whose
    # default env_delete list drops every LD_* variable, so the hook would never load and
    # the VRAM limit would go unenforced. Let LD_* through; only root invokes this sudo.
    echo 'Defaults env_delete -= "LD_*"' > /etc/sudoers.d/20-hami-ld-audit \
      && chmod 0440 /etc/sudoers.d/20-hami-ld-audit
    for dev in /dev/kfd /dev/dri/card* /dev/dri/renderD*; do
      [ -e "$dev" ] || continue
      gid=$(stat -c %g "$dev")
      if [ "$gid" = "0" ]; then
        chmod 0666 "$dev" && echo "gpu-hook: chmod 0666 $dev (owned by root)"
        continue
      fi
      getent group "$gid" >/dev/null 2>&1 || groupadd -g "$gid" "gpu-$gid"
      usermod -aG "$gid" "${NB_USER}" && echo "gpu-hook: added ${NB_USER} to gid $gid for $dev"
    done
{{- end }}
