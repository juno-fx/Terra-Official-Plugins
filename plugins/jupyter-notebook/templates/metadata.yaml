apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-terra-metadata
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Application"  # mark this as a workload and it's type for the
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "Jupyter Notebook"
  fields: |
    - name: registry
      description: "Registry to pull the image from"
      type: string
      required: true
      default: "quay.io/jupyter"
    - name: gpu
      description: "GPU for the notebook: off, nvidia (nvidia.com/gpu, NVIDIA GPU Operator) or amd (amd.com/gpu, AMD GPU Operator). A pod requests one vendor only."
      type: select
      required: true
      default: "off"
      options:
        - "off"
        - nvidia
        - amd
    - name: repo
      description: "Repository to pull the image from"
      type: string
      required: true
      default: "datascience-notebook"
    - name: tag
      description: "Tag to pull the image from"
      type: string
      required: true
      default: "lab-4.4.9"
    - name: nginx_registry
      description: "Registry to pull the nginx sidecar image from"
      type: string
      required: true
      default: "docker.io"
    - name: nginx_repo
      description: "Repository to pull the nginx sidecar image from"
      type: string
      required: true
      default: "nginx"
    - name: nginx_tag
      description: "Tag to pull the nginx sidecar image from"
      type: string
      required: true
      default: "alpine"
    - name: icon
      default: "https://raw.githubusercontent.com/juno-fx/Terra-Official-Plugins/refs/heads/main/plugins/jupyter-notebook/assets/logo.png"
  env_hints: |
    - name: HAMI_GPU_MEMORY
      description: GPU memory in GiB the notebook may use (HAMi GPU Sharing plugin), fractions allowed (0.5 = 512 MiB). Rendered as the pod's nvidia.com/gpumem or amd.com/gpumem limit in MiB, not passed into the container. Unset together with HAMI_GPU_CORES gives the notebook the whole GPU.
    - name: HAMI_GPU_CORES
      description: Share of the GPU's compute the notebook may use, 1-100 (HAMi). Rendered as the pod's nvidia.com/gpucores or amd.com/gpucores limit, not passed into the container. Unset reserves no compute on nvidia and all of it on amd.
    - name: GRANT_SUDO
      description: Set to `yes` (or `1`; `true` is ignored) to grant the notebook user passwordless sudo, useful for installing OS packages with apt from within the notebook's terminal.
    - name: RESTARTABLE
      description: Runs Jupyter in a restart loop so quitting or a kernel restart doesn't kill the container.
    - name: DOCKER_STACKS_JUPYTER_CMD
      description: Launches a different frontend (notebook, nbclassic, retro) instead of the default JupyterLab.
