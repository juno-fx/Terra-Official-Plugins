{{- if and .Values.webhooks_public (not .Values.domain) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-webhook-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/limit-rps: "{{ .Values.webhook_rate_limit }}"
    {{- if .Values.webhook_allow_cidrs }}
    nginx.ingress.kubernetes.io/whitelist-source-range: "{{ .Values.webhook_allow_cidrs }}"
    {{- end }}
spec:
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: "/{{ .Release.Namespace }}/{{ .Values.name }}/webhook/"
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: 8080
          - path: "/{{ .Release.Namespace }}/{{ .Values.name }}/webhook-test/"
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: 8080
          - path: "/{{ .Release.Namespace }}/{{ .Values.name }}/webhook-waiting/"
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: 8080
{{- end }}
