events {}
http {
{{- if and .Values.webhooks_public (not .Values.domain) }}
    # Recover the caller's IP from X-Forwarded-For, so the webhook rate limit and CIDR allow list
    # apply per caller rather than to the ingress controller. Trusts in-cluster (private/CGNAT) proxies only.
    # Recursive: skip trusted in-network hops (e.g. an internal load balancer in front of the controller)
    # and use the client they recorded.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=webhooks:10m rate={{ max 1 (int (default 10 .Values.webhook_rate_limit)) }}r/s;
{{- end }}

    server {
        listen 8080;
        server_name _;
        # No upload size cap in the sidecar (nginx defaults to 1m); the cluster's ingress sets the limit.
        client_max_body_size 0;

{{- if .Values.domain }}

        location / {
            proxy_pass http://127.0.0.1:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Pass through the controller's scheme; $scheme here is always http.
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
{{- else }}

        # Redirect the slashless path so the browser URL gains the slash and relative assets resolve.
        location = /{{ .Release.Namespace }}/n8n/{{ .Values.name }} {
            # Relative Location; an absolute one would carry the sidecar's http://...:8080.
            absolute_redirect off;
            return 301 $uri/;
        }

        location /{{ .Release.Namespace }}/n8n/{{ .Values.name }}/socket.io/ {
            auth_request /auth;
            proxy_pass http://127.0.0.1:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Pass through the controller's scheme; $scheme here is always http.
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /{{ .Release.Namespace }}/n8n/{{ .Values.name }}/ {
            auth_request /auth;
            rewrite ^/{{ .Release.Namespace }}/n8n/{{ .Values.name }}/(.*) /$1 break;
            proxy_pass http://127.0.0.1:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
{{- if .Values.webhooks_public }}
{{- range list "webhook" "webhook-test" "webhook-waiting" }}

        # Public webhook path: no Hubble login, so third-party services can call it.
        location /{{ $.Release.Namespace }}/n8n/{{ $.Values.name }}/{{ . }}/ {
            # Same burst as ingress-nginx's limit-rps (5x the rate).
            limit_req zone=webhooks burst={{ mul (max 1 (int (default 10 $.Values.webhook_rate_limit))) 5 }} nodelay;
            {{- if $.Values.webhook_allow_cidrs }}
            {{- range splitList "," $.Values.webhook_allow_cidrs }}{{ with trim . }}
            allow {{ . }};
            {{- end }}{{ end }}
            deny all;
            {{- end }}
            rewrite ^/{{ $.Release.Namespace }}/n8n/{{ $.Values.name }}/(.*) /$1 break;
            proxy_pass http://127.0.0.1:5678;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
{{- end }}
{{- end }}

        location = /auth {
            internal;
            proxy_pass http://hubble.{{ .Release.Namespace }}.svc.cluster.local:3000/api/auth-workstation/{{ .Values.name }}/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        location / {
            return 404;
        }
{{- end }}
    }
}
