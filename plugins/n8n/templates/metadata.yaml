apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-terra-metadata"
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Workspace"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "n8n is an open-source workflow automation tool that allows you to connect various applications and services to automate tasks and processes. It provides a visual interface for creating workflows, making it easy to integrate different systems without the need for coding. With n8n, you can automate repetitive tasks, streamline data processing, and enhance productivity by connecting APIs, databases, and other services in a seamless manner."
  fields: |
    - name: icon
      default: "https://raw.githubusercontent.com/juno-fx/Terra-Official-Plugins/refs/heads/main/plugins/n8n/scripts/assets/logo.png"
    - name: registry
      description: "Registry to pull the image from"
      type: string
      required: true
      default: "docker.n8n.io/n8nio"
    - name: repo
      description: "Repository to pull the image from"
      type: string
      required: true
      default: "n8n"
    - name: tag
      description: "Tag to pull the image from"
      type: string
      required: true
      default: "latest"
    - name: timezone
      description: "Timezone to use for the n8n instance"
      type: string
      required: true
      default: "America/New_York"
    - name: storage_class
      description: Storage class to use for the game disk
      required: true
      type: k8sStorageClass
    - name: storage_size
      description: Storage size to use for the game disk
      default: 10Gi
      required: true
      type: string
    - name: hostname
      description: "Serve this instance at its own domain, for example n8n.example.com, instead of a path on the platform host. Leave empty to keep the platform path"
      type: string
      required: false
    - name: tls_issuer
      description: "cert-manager ClusterIssuer used to obtain the certificate for that domain, for example letsencrypt-prod. Only used when a hostname is set"
      type: string
      required: false
    - name: publish_dns
      description: "Annotate the route so the ExternalDNS plugin creates the DNS record for that domain"
      type: boolean
      required: false
      default: false
    - name: webhooks_public
      description: "Allow public access to the n8n webhook paths (the editor stays authenticated). Not used when a hostname is set, since the whole instance is then served from that domain"
      type: boolean
      required: true
      default: false
    - name: webhook_rate_limit
      description: "Requests per second allowed on the public webhook paths"
      type: int
      required: false
      default: 10
    - name: webhook_allow_cidrs
      description: "Comma separated CIDR ranges allowed to reach the public webhook paths, e.g. 203.0.113.0/24,198.51.100.7/32"
      type: string
      required: false
  env_hints: |
    - name: N8N_ENCRYPTION_KEY
      description: Custom key n8n uses to encrypt stored credentials. Set this to keep credentials decryptable across restarts/re-deploys.
    - name: N8N_PROXY_HOPS
      description: Number of reverse proxies in front of n8n. Set to "2" for the ingress controller and the nginx sidecar, so webhook nodes see the real caller IP rather than the ingress IP.
    - name: EXECUTIONS_DATA_PRUNE
      description: Prunes old execution records ("true" or "false"). Without pruning, execution history grows until the volume fills.
    - name: EXECUTIONS_DATA_MAX_AGE
      description: Hours of execution history to keep when pruning is enabled (e.g. "336" for two weeks).
    - name: N8N_DIAGNOSTICS_ENABLED
      description: Set to "false" to disable outbound telemetry.