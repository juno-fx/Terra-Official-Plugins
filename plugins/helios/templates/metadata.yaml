apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-terra-metadata"
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "Helios deployment with desktop streaming"
  fields: |
    - name: icon
      default: "https://raw.githubusercontent.com/juno-fx/Terra-Official-Plugins/refs/heads/main/plugins/helios/assets/logo.png"
    - name: gpu
      description: "GPU for the workstation: off, nvidia (nvidia.com/gpu, NVIDIA GPU Operator) or amd (amd.com/gpu, AMD GPU Operator). A pod requests one vendor only."
      type: select
      required: true
      default: "off"
      options:
        - "off"
        - nvidia
        - amd
    - name: registry
      description: "Registry to pull the image from"
      type: string
      required: true
      default: "junoinnovations"
    - name: repo
      description: "Repository to pull the image from"
      type: string
      required: true
      default: "helios"
    - name: tag
      description: "Tag to pull the image from"
      type: string
      required: true
      default: "unstable-rocky-9"
    - name: enableAPI
      description: "Enable system-to-system communication"
      type: boolean
      required: true
      default: false
    - name: rheaRepo
      description: "Repo to pull the rhea image from"
      type: string
      required: true
      default: "rhea"
    - name: rheaTag      
      description: "Tag to pull the rhea image from"
      type: string
      required: true
      default: "v1.2.3"
    - name: nginx_registry
      description: "Registry to pull the nginx sidecar image from"
      type: string
      required: true
      default: "docker.io"
    - name: nginx_repo
      description: "Repository to pull the nginx sidecar image from"
      type: string
      required: true
      default: "nginx"
    - name: nginx_tag
      description: "Tag to pull the nginx sidecar image from"
      type: string
      required: true
      default: "1.30.7-alpine"
    - name: publicAccess
      description: "Allow public access (disable authentication)"
      type: boolean
      required: true
      default: false
  env_hints: |
    - name: HAMI_GPU_MEMORY
      description: GPU memory in GiB the workstation may use (HAMi GPU Sharing plugin), fractions allowed (0.5 = 512 MiB). Rendered as the pod's nvidia.com/gpumem or amd.com/gpumem limit in MiB, not passed into the container. Unset, the HAMi plugin's default_gpu_memory applies (8 GiB as shipped); without HAMi it must stay unset.
    - name: HAMI_GPU_CORES
      description: Share of the GPU's compute the workstation may use, 1-100 (HAMi). Rendered as the pod's nvidia.com/gpucores or amd.com/gpucores limit, not passed into the container. Unset reserves no compute on nvidia and all of it on amd.
    - name: PASSWORD
      description: Password set for the users terminal session.
      expose: true
    - name: SUDO
      description: Grants the user sudo access on the container ("true" or "1").
    - name: SELKIES_FRAMERATE
      description: Streaming framerate for the desktop session, as a range (e.g. "15-60") or fixed value (e.g. "30").
    - name: DISABLE_VGL
      description: Disables the VirtualGL wrapper around the desktop session; apps needing it must be launched manually via vglrun.
    - name: REMOTE_PROTOCOL
      description: if set to "dcv" Helios will run Nice DCV rather than Selkies.
