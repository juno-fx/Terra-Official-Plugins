apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-terra-metadata"
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "Helios deployment with desktop streaming"
  fields: |
    - name: icon
      default: "https://raw.githubusercontent.com/juno-fx/Terra-Official-Plugins/refs/heads/main/plugins/helios/assets/logo.png"
    - name: gpu
      description: "Use a GPU"
      type: boolean
      required: true
    - name: registry
      description: "Registry to pull the image from"
      type: string
      required: true
      default: "junoinnovations"
      group: Helios Image Settings
    - name: repo
      description: "Repository to pull the image from"
      type: string
      required: true
      default: "helios"
      group: Helios Image Settings
    - name: tag
      description: "Tag to pull the image from"
      type: string
      required: true
      default: "unstable-rocky-9"
      group: Helios Image Settings
    - name: enableAPI
      description: "Enable system-to-system communication"
      type: boolean
      required: true
      default: false
      group: Orion API Integration
    - name: rheaRepo
      description: "Repo to pull the rhea image from"
      type: string
      required: true
      default: "rhea"
      group: Orion API Integration
    - name: rheaTag
      description: "Tag to pull the rhea image from"
      type: string
      required: true
      default: "v1.2.3"
      group: Orion API Integration
    - name: nginx_registry
      description: "Registry to pull the nginx sidecar image from"
      type: string
      required: true
      default: "docker.io"
      group: Ingress
    - name: nginx_repo
      description: "Repository to pull the nginx sidecar image from"
      type: string
      required: true
      default: "nginx"
      group: Ingress
    - name: nginx_tag
      description: "Tag to pull the nginx sidecar image from"
      type: string
      required: true
      default: "alpine"
      group: Ingress
    - name: publicAccess
      description: "Allow public access (disable authentication)"
      type: boolean
      required: true
      default: false
      group: Ingress
    - name: dcvLoadBalancer
      description: "Expose Nice DCV on a LoadBalancer (8443 TCP) for native DCV clients. Also sets REMOTE_PROTOCOL=dcv. Requires the PASSWORD env var, set at launch or in this template's env (a template password is shared by every workstation launched from it); without it DCV does not listen on the load balancer. Some providers (e.g. GKE, Azure) make the load balancer public by default; use loadBalancerAnnotations to make it internal"
      type: boolean
      required: true
      default: false
      group: DCV Settings
    - name: dcvQuic
      description: "Also expose Nice DCV on 8443 UDP for QUIC (dcvLoadBalancer only). The load balancer must support TCP and UDP on the same port. On AWS this needs the AWS Load Balancer Controller installed; the built-in AWS cloud provider cannot create it"
      type: boolean
      required: true
      default: false
      group: DCV Settings
    - name: loadBalancerAnnotations
      description: "Extra annotations for the DCV LoadBalancer service (dcvLoadBalancer only). Example for CoreWeave: key service.beta.kubernetes.io/coreweave-load-balancer-type, value public"
      required: false
      type: list
      group: DCV Settings
      fields:
        - name: key
          description: "Annotation key (e.g. service.beta.kubernetes.io/coreweave-load-balancer-type)"
          type: string
          required: false
        - name: value
          description: "Annotation value (e.g. public)"
          type: string
          required: false
  env_hints: |
    - name: PASSWORD
      description: Password set for the users terminal session. Required to sign in through the DCV load balancer (dcvLoadBalancer); not needed for DCV in the browser through Hubble.
      expose: true
    - name: SUDO
      description: Grants the user sudo access on the container ("true" or "1").
    - name: SELKIES_FRAMERATE
      description: Streaming framerate for the desktop session, as a range (e.g. "15-60") or fixed value (e.g. "30").
    - name: DISABLE_VGL
      description: Disables the VirtualGL wrapper around the desktop session; apps needing it must be launched manually via vglrun.
    - name: REMOTE_PROTOCOL
      description: if set to "dcv" Helios will run Nice DCV rather than Selkies.
