{{- $amd := eq (toString .Values.gpu) "amd" -}}
{{- $nvidia := eq (toString .Values.gpu) "nvidia" -}}
{{- /* HAMi slice size arrives through the launch-time env list (admin-set, see env_hints).
       The two names are consumed here and kept out of the containers. Non-numeric reads as 0;
       cores go through float64 so a decimal floors instead of dropping to 0. */ -}}
{{- $gpuMem := 0 -}}
{{- $gpuCores := 0 -}}
{{- range .Values.env }}
  {{- /* GiB in, MiB out: HAMi gpumem is MiB. float64 keeps fractions ("0.5" -> 512). */ -}}
  {{- if eq .name "HAMI_GPU_MEMORY" }}{{ $gpuMem = int (mulf (float64 .value) 1024) }}{{ end }}
  {{- if eq .name "HAMI_GPU_CORES" }}{{ $gpuCores = int (float64 .value) }}{{ end }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Values.name }}"
  annotations:
    # comma separated list of users that can access this workstation as read only.
    juno-innovations.com/shared: "none"
    juno-innovations.com/kuiper-state: "{{ .Values._kuiper }}"
  labels:
    juno-innovations.com/workstation: "{{ .Values.name }}"
    juno-innovations.com/user: "{{ .Values.user }}"
    juno-innovations.com/session: "{{ .Values.session }}"


spec:
  replicas: 1

  selector:
    matchLabels:
      juno-innovations.com/workstation: "{{ .Values.name }}"

  template:
    metadata:
      labels:
        juno-innovations.com/user: "{{ .Values.user }}"
        juno-innovations.com/workstation: "{{ .Values.name }}"
        # Kuiper's label injection does not reach pod templates; the NetworkPolicy
        # selects on this label, so the pod must declare it itself.
        kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
      annotations:
        # This will block the cluster autoscaler from evicting this pod in the case
        # it can move to a cheaper instance. This does come at a cost, but ideally
        # this should stop from a workstation getting ripped out from under existing users.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

    spec:
      {{- if .Values.enableAPI }}
      serviceAccountName: helios
      {{- end }}
      hostname: "{{ .Values.name }}"
      terminationGracePeriodSeconds: 45

      # workstation nodes will require juno-innovations.com/workstation: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: juno-innovations.com/workstation
                    operator: In
                    values:
                      - "true"
                  {{- if .Values.selector }}
                  {{- range .Values.selector }}
                  - key: {{ .key | quote }}
                    operator: In
                    values:
                      - {{ .value | quote }}
                  {{- end }}
                  {{- end }}

      # allow for this pod to work on nodes reserved for workstations
      tolerations:
        - key: "juno-innovations.com/workstation"
          operator: "Exists"
          effect: "NoSchedule"

      {{- if $nvidia }}
      runtimeClassName: nvidia
      {{- end }}

      {{- if .Values.pullSecret }}
      imagePullSecrets:
        - name: "{{ .Values.pullSecret }}"
      {{- end }}

      {{- if .Values.enableAPI }}
      initContainers:
        - name: copy-orionpy   # Identifies this init container within the Pod
          # Image used to run this init container - must contain the orionpy package
          image: "{{ .Values.registry }}/{{ .Values.rheaRepo }}:{{ .Values.rheaTag }}"
          command: ['sh', '-c', 'cp -r /opt/juno/orion /mnt/shared/']
          volumeMounts:
            - name: orionpy-volume
              mountPath: /mnt/shared
      {{- end }}

      containers:
        - name: helios
          imagePullPolicy: IfNotPresent
          image: "{{ .Values.registry }}/{{ .Values.repo }}:{{ .Values.tag }}"
          lifecycle:
            preStop:
              exec:
                command: ["/etc/helios/shutdown.d/custom.sh"]
          resources:
            requests:
              memory: "{{ .Values.memory }}"
              cpu: "{{ .Values.cpu }}"
            # gotmpl's or is a function taking 2 args - this is "X or Y or Z" translated to python
            {{- if or (or $nvidia $amd) (or .Values.memoryLimit .Values.cpuLimit) }}
            limits:
            {{- if $nvidia }}
              nvidia.com/gpu: "1"
              {{- if gt $gpuMem 0 }}
              nvidia.com/gpumem: "{{ $gpuMem }}"
              {{- end }}
              {{- if gt $gpuCores 0 }}
              nvidia.com/gpucores: "{{ $gpuCores }}"
              {{- end }}
            {{- end }}
            {{- if $amd }}
              amd.com/gpu: "1"
              {{- if gt $gpuMem 0 }}
              amd.com/gpumem: "{{ $gpuMem }}"
              {{- end }}
              {{- if gt $gpuCores 0 }}
              amd.com/gpucores: "{{ $gpuCores }}"
              {{- end }}
            {{- end }}
            {{- if .Values.cpuLimit }}
              cpu: "{{ .Values.cpuLimit }}"
            {{- end }}
            {{- if .Values.memoryLimit }}
              memory: "{{ .Values.memoryLimit }}"
            {{- end }}
            {{- end }}
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 2 # helios boots very fast
            failureThreshold: 60  # start up totals 2 * 60 = 2 mins
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 3000
            failureThreshold: 24
            periodSeconds: 5
          ports:
            - containerPort: 3000
              name: viewer
          env:
            - name: JUNO_WORKSTATION
              value: "{{ .Values.name }}"
            - name: JUNO_PROJECT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JUNO_WORKSPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JUNO_ENVIRONMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: USER
              value: "{{ .Values.user }}"
            - name: HOME
              value: "/home/{{ .Values.user }}"
            - name: UID
              value: "{{ .Values.puid }}"
            - name: GID
              value: "{{ .Values.guid }}"
            - name: PREFIX
              value: "/{{ .Release.Namespace }}/helios/{{ .Values.name }}/"
            {{- range .Values.env }}
            {{- if not (has .name (list "HAMI_GPU_MEMORY" "HAMI_GPU_CORES")) }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}
            {{- if .Values.plugins }}
            {{- range .Values.plugins }}
            - name: {{ .name | quote }}
              subPath: {{ .file | quote }}
              mountPath: "/etc/helios/init.d/{{ .name }}/{{ .file }}"
            {{- end }}
            {{- end }}
            {{- if .Values.enableAPI }}
            - name: orionpy-volume
              mountPath: /opt/juno
            {{- end }}
        - name: nginx
          image: "{{ .Values.nginx_registry }}/{{ .Values.nginx_repo }}:{{ .Values.nginx_tag }}"
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
        {{- if .Values.enableAPI }}
        - name: rhea
          image: "{{ .Values.registry }}/{{ .Values.rheaRepo }}:{{ .Values.rheaTag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACED
              value: "true"
            - name: NAMESPACE
              value: {{ .Release.Namespace }}
          {{- range .Values.env }}
          {{- if not (has .name (list "HAMI_GPU_MEMORY" "HAMI_GPU_CORES")) }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
          {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /.health
              port: 13000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /.health
              port: 13000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "{{ .Values.rheaMemory }}"
              cpu: "{{ .Values.rheaCpu }}"
            limits:
            {{- if .Values.rheaCpuLimit }}
              cpu: "{{ .Values.rheaCpuLimit }}"
            {{- end }}
            {{- if .Values.rheaMemoryLimit }}
              memory: "{{ .Values.rheaMemoryLimit }}"
            {{- end }}
        {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: "{{ .Values.name }}-nginx"
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        {{- if .Values.volumeMounts }}
        {{- toYaml .Values.volumes | nindent 8 }}
        {{- end }}
        {{- if .Values.plugins }}
        {{- range .Values.plugins }}
        - name: {{ .name | quote }}
          configMap:
            name: {{ .config | quote }}
            defaultMode: 0777
        {{- end }}
        {{- end }}
        {{- if .Values.enableAPI }}
        - name: orionpy-volume
          emptyDir: {}
        {{- end }}