apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}"
spec:
  type: ClusterIP
  selector:
    juno-innovations.com/workstation: "{{ .Values.name }}"
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
{{- if eq .Values.serviceType "LoadBalancer" }}
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-dcv"
  labels:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
  annotations:
    {{- if eq .Values.coreweaveLoadBalancer true }}
    service.beta.kubernetes.io/coreweave-load-balancer-type: public
    {{- end }}
spec:
  type: LoadBalancer
  selector:
    juno-innovations.com/workstation: "{{ .Values.name }}"
  ports:
    - port: 8443
      targetPort: 8443
      protocol: TCP
      name: dcv-tcp
    - port: 8443
      targetPort: 8443
      protocol: UDP
      name: dcv-udp
{{- end }}
