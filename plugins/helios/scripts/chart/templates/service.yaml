apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}"
  annotations:
    {{- if eq .Values.coreweaveLoadBalancer true }}
    service.beta.kubernetes.io/coreweave-load-balancer-type: public
    {{- end }}
spec:
  type: {{ .Values.serviceType }}
  selector:
    juno-innovations.com/workstation: "{{ .Values.name }}"
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
