{{- if .Values.gpu }}
# NVIDIA glvnd vendor files. Each key is projected into its own directory in
# workstation.yaml (glx- -> glx_vendor.d, egl- -> egl_vendor.d) as 10_nvidia.json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.name }}-nvidia-icd"
  labels:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
data:
  glx-10_nvidia.json: |
    {
        "file_format_version" : "1.0.0",
        "ICD" : {
            "library_path" : "libGLX_nvidia.so.0"
        }
    }
  egl-10_nvidia.json: |
    {
        "file_format_version" : "1.0.0",
        "ICD" : {
            "library_path" : "libEGL_nvidia.so.0"
        }
    }
{{- end }}
