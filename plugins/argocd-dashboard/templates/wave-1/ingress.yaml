{{- /*
  Plain, controller-agnostic Ingress. Auth, streaming and timeouts live in the nginx proxy
  (files/nginx/nginx.conf). Kuiper does not launch this plugin, so nothing overrides the class:
  the ingressClass install field sets it, falling back to nginx (unchanged behaviour for
  existing installs). "default" omits ingressClassName so the cluster's default IngressClass is used.
*/}}
{{- $class := .Values.ingressClass | default "nginx" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Release.Name }}-argocd-server-ingress"
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  {{- if ne $class "default" }}
  ingressClassName: {{ $class }}
  {{- end }}
  rules:
    - host: "{{ .Values.host }}"
      http:
        paths:
          - path: "{{ .Values.prefix }}"
            pathType: Prefix
            backend:
              service:
                name: "{{ .Release.Name }}-proxy"
                port:
                  number: 8080
