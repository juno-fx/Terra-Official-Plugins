apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-nginx"
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  nginx.conf: |
{{ tpl (.Files.Get "files/nginx/nginx.conf") . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-proxy"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: "{{ .Release.Name }}-proxy"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Release.Name }}-proxy"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Release.Name }}-proxy"
      annotations:
        # Roll the proxy when its config changes.
        checksum/nginx: {{ tpl (.Files.Get "files/nginx/nginx.conf") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- if gt (len .Values._juno_terra_image_pull_secrets) 0 }}
      imagePullSecrets:
{{ toYaml .Values._juno_terra_image_pull_secrets | indent 8 }}
      {{- end }}
      containers:
        - name: nginx
          image: "{{ .Values.nginx_registry }}/{{ .Values.nginx_repo }}:{{ .Values.nginx_tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            tcpSocket:
              port: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx
          configMap:
            name: "{{ .Release.Name }}-nginx"
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-proxy"
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app.kubernetes.io/name: "{{ .Release.Name }}-proxy"
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
