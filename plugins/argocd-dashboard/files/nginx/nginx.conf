# Auth proxy in front of argocd-server. Rendered with tpl into the <release>-nginx ConfigMap
# (templates/wave-1/proxy.yaml). It enforces the Genesis login itself, so the Ingress carries no
# controller-specific annotations and behaves the same on ingress-nginx, Traefik, etc.
#
# This gate matters: configure.sh disables ArgoCD's own login (anonymous admin), so this proxy
# is the only thing between the route and the ArgoCD UI/API.
events {}
http {
  server {
    listen 8080;
    listen [::]:8080;

    location {{ .Values.prefix }} {
      # Force HTTPS (was the force-ssl-redirect annotation). Runs before auth_request, so
      # cookies and ArgoCD API calls never travel over plain http. 308 keeps the method and
      # body, matching ingress-nginx's redirect code.
      if ($http_x_forwarded_proto = "http") {
        return 308 https://$host$request_uri;
      }

      auth_request /auth;
      # Unauthenticated callers go to the Genesis unauthorized page (was the auth-signin annotation).
      error_page 401 = @signin;

      # argocd-server serves HTTP and TLS on the same port; TLS matches the previous
      # backend-protocol: HTTPS behaviour. The cert is ArgoCD's self-signed one.
      proxy_pass https://argocd-server.{{ .Release.Namespace }}.svc.cluster.local:80;
      proxy_ssl_verify off;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Pass through the controller's scheme; $scheme here is always http.
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

      # The Argo UI streams resource updates — don't buffer, and keep idle streams open.
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location = /auth {
      internal;
      proxy_pass http://genesis.{{ .Release.Namespace }}.svc.cluster.local:3000/api/auth-service/{{ .Release.Name }}/;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      # Same headers ingress-nginx's auth-url subrequest sent; the browser's cookies pass through.
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-URL $http_x_forwarded_proto://$host$request_uri;
      proxy_set_header X-Original-Method $request_method;
    }

    location @signin {
      return 302 /unauthorized/;
    }

    location / {
      return 404;
    }
  }
}
