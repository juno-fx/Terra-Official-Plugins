apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.name }}-runtime-commands"
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e
    set -x

    if [ -n "$GIT_URL" ]; then
      CLONE_DIR="$(mktemp -d /tmp/XXXXXXXX)"
      set +x
      git clone "$GIT_URL" "$CLONE_DIR"
      git -C "$CLONE_DIR" remote set-url origin "$(printf '%s' "$GIT_URL" | sed -E 's#^(https?)://[^/@]+@#\1://#')"
      set -x
      if [ -n "$GIT_REF" ]; then
        git -C "$CLONE_DIR" checkout "$GIT_REF"
      fi
      WORK_ROOT="$CLONE_DIR"
    elif [ -n "$SOURCE_PATH" ]; then
      WORK_ROOT="$SOURCE_PATH"
      mkdir -p "$WORK_ROOT"
    fi

    if [ -n "$WORK_ROOT" ]; then
      if [ -n "$BUILD_COMMAND" ]; then
        cd "$WORK_ROOT" && eval "$BUILD_COMMAND"
      fi
      cd "$WORK_ROOT"
    fi

    eval "$RUN_COMMAND"
