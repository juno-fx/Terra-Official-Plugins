{{- if eq .Values.network_mode "ingress-auth" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-ingress
spec:
  # Kuiper >= 4.8.0 overwrites this with the launching namespace's IngressClass.
  # nginx is the fallback for older deployments;
  ingressClassName: nginx
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: "/{{ .Release.Namespace }}/runtime-cpp/{{ .Values.name }}/"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}
                port:
                  number: 8081
{{- end }}

{{- if eq .Values.network_mode "ingress-noauth" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-ingress
  {{- if .Values.domain }}
  {{- if or .Values.tls_issuer .Values.publish_dns }}
  annotations:
    {{- if .Values.tls_issuer }}
    cert-manager.io/cluster-issuer: {{ .Values.tls_issuer }}
    {{- end }}
    {{- if .Values.publish_dns }}
    external-dns.alpha.kubernetes.io/enable: "true"
    {{- end }}
  {{- end }}
  {{- end }}
spec:
  # Kuiper >= 4.8.0 overwrites this with the launching namespace's IngressClass.
  # nginx is the fallback for older deployments;
  ingressClassName: nginx
  {{- if and .Values.domain .Values.tls_issuer }}
  tls:
    - hosts:
        - {{ .Values.name }}.{{ .Values.domain }}
      secretName: {{ .Values.name }}-tls
  {{- end }}
  rules:
    - host: {{ if .Values.domain }}{{ .Values.name }}.{{ .Values.domain }}{{ else }}{{ .Values.host }}{{ end }}
      http:
        paths:
          - path: {{ if .Values.domain }}"/"{{ else }}"/{{ .Release.Namespace }}/runtime-cpp/{{ .Values.name }}/"{{ end }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}
                port:
                  number: {{ .Values.port }}
{{- end }}
