apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.name }}"
  labels:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
spec:
  selector:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    - port: {{ .Values.app_port }}
      targetPort: {{ .Values.app_port }}
      protocol: TCP
      name: git
