apiVersion: crossplane.juno-innovations.com/v1alpha1
kind: EC2Instance
metadata:
  name: {{.Release.Namespace}}-{{.Values.name}}-ec2
  namespace: {{.Release.Namespace}}
  annotations:
    {{- $access := .Values.access | default "public" }}
    {{- $lb := hasPrefix "load_balancer_" $access }}
    kuiper.juno-innovations.com/use-private-dns: "{{ eq $access "vpn" }}"
    {{- if $lb }}
    kuiper.juno-innovations.com/aws-load-balancer: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    {{- if eq $access "load_balancer_internal" }}
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    {{- else }}
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    {{- end }}
    {{- end }}
    juno-innovations.com/workload: "Virtual Machine"
    kuiper.juno-innovations.com/aws-remote-connection: "true"
    {{- if .Values.ports }}
    kuiper.juno-innovations.com/expose: "{{ range $i, $p := .Values.ports }}{{ if $i }},{{ end }}{{ $p.port }}{{ end }}"
    {{- end }}
spec:
  parameters:
    name: "{{.Release.Namespace}}-{{.Values.name}}"
    region: {{.Values.region}}
    amiImageId: {{.Values.ami_image_id}}
    instanceType: {{.Values.instance_type}}
    subnetId: {{.Values.subnet_id}}
    securityGroupIds:
    {{- range .Values.security_group_ids}}
      - {{.id}}
    {{- end}}
    blockDeviceMappings:
    {{- range .Values.block_device_mappings}}
      - deviceName: {{.mount_path}}
        ebs:
          deleteOnTermination: {{$.Values.delete_on_termination}}
          volumeSize: {{.size}}
    {{- end}}
    providerConfigRef: {{.Values.provider_config_ref}}
    tags:
      - key: Name
        value: "{{.Release.Namespace}}-{{.Values.name}}"
      - key: orion-owner
        value: {{ .Values.user | quote }}
    {{- with .Values.iam_instance_profile }}
    iamInstanceProfile: {{ . | quote }}
    {{- end }}
