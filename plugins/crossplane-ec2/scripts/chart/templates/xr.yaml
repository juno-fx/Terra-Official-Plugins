apiVersion: crossplane.juno-innovations.com/v1alpha1
kind: EC2Instance
metadata:
  name: {{.Release.Namespace}}-{{.Values.name}}-ec2
  namespace: {{.Release.Namespace}}
  annotations:
    kuiper.juno-innovations.com/use-private-dns: "false"
    kuiper.juno-innovations.com/aws-private-subnet: "{{ .Values.aws_private_subnet | default false }}"
    {{- if and .Values.aws_private_subnet .Values.load_balancer }}
    kuiper.juno-innovations.com/aws-load-balancer: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
    service.beta.kubernetes.io/aws-load-balancer-scheme: {{ .Values.load_balancer }}
    {{- end }}
    juno-innovations.com/workload: "Virtual Machine"
    kuiper.juno-innovations.com/aws-remote-connection: "true"
    {{- if .Values.ports }}
    kuiper.juno-innovations.com/expose: "{{ range $i, $p := .Values.ports }}{{ if $i }},{{ end }}{{ $p.port }}{{ end }}"
    {{- end }}
spec:
  parameters:
    name: "{{.Release.Namespace}}-{{.Values.name}}"
    region: {{.Values.region}}
    amiImageId: {{.Values.ami_image_id}}
    instanceType: {{.Values.instance_type}}
    subnetId: {{.Values.subnet_id}}
    securityGroupIds:
    {{- range .Values.security_group_ids}}
      - {{.id}}
    {{- end}}
    blockDeviceMappings:
    {{- range .Values.block_device_mappings}}
      - deviceName: {{.mount_path}}
        ebs:
          deleteOnTermination: {{$.Values.delete_on_termination}}
          volumeSize: {{.size}}
    {{- end}}
    providerConfigRef: {{.Values.provider_config_ref}}
