apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-terra-metadata"
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Virtual Machine"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "Crossplane AWS EC2 Instance"
  fields: |
    - name: icon
      default: "https://raw.githubusercontent.com/juno-fx/Terra-Official-Plugins/refs/heads/main/plugins/crossplane-ec2/scripts/assets/logo.png"
    - name: ami_image_id
      required: true
      type: string
    - name: security_group_ids
      description: List of AWS security group ids
      required: true
      type: list
      fields:
        - name: id
          description: Security group id
          required: true
          type: string
    - name: block_device_mappings
      description: List of block device mappings for the EC2 instance
      required: true
      type: list
      fields:
        - name: mount_path
          description: Mount path for the block device (e.g. /dev/sdx)
          required: true
          type: string
        - name: size
          description: Block device size in GB
          required: true
          type: int
    - name: subnet_id
      description: AWS Subnet ID
      required: true
      type: string
    - name: instance_type
      description: AWS EC2 instance type (e.g. t3.micro)
      required: true
      type: string
      default: t3.micro
    - name: delete_on_termination
      description: Delete EBS volumes when the EC2 instance is terminated
      type: boolean
      default: true
      required: true
    - name: access
      description: "How users reach the instance. public: directly at its public address. vpn: directly at its private IP, for users on a VPN, Direct Connect or peered network. load_balancer_internal: through a private AWS NLB, for users on a VPN or peered network who can't reach the instance directly. load_balancer_public: through a public AWS NLB, for users on the internet when the instance has no public address. The public NLB accepts connections from any IP address"
      type: select
      required: true
      default: public
      options:
        - public
        - vpn
        - load_balancer_internal
        - load_balancer_public
    - name: ports
      description: "TCP ports to expose from the instance (e.g. 22 for SSH, 3389 for RDP, 8443 for NICE DCV). The instance's security groups must allow them. Fixed at launch"
      required: false
      type: list
      fields:
        - name: port
          description: TCP port the application listens on inside the instance
          required: true
          type: int
          default: 22
    - name: region
      description: AWS Region
      required: true
      type: string
    - name: provider_config_ref
      description: Name of the providerConfig for connecting to AWS
      required: true
      type: string
      default: "aws-provider-argocd-provider-config"
    - name: iam_instance_profile
      description: >-
        IAM instance profile name to attach to every instance launched from this template
        (e.g. production-artists). Leave blank for none. Amazon DCV seats need one that allows
        reading the DCV license from S3.
      required: false
      type: string