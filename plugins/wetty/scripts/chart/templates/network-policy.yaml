apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-network-policy
  labels:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
spec:
  podSelector:
    matchLabels:
      kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingressNamespace }}
      ports:
        - protocol: TCP
          port: 3001
        {{- range splitList "," (.Values.published_ports | toString) }}
        {{- if trim . }}
        - protocol: TCP
          port: {{ trim . | int }}
        {{- end }}
        {{- end }}
  {{- if .Values.allow_egress }}
  egress:
    - {}
  {{- else }}
  egress: []
  {{- end }}
