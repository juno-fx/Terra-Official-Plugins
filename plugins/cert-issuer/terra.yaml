resource_id: cert-issuer
name: Certificate Issuer
icon: https://github.com/juno-fx/Terra-Official-Plugins/blob/main/plugins/cert-issuer/assets/icon.svg?raw=true
description: Creates the ACME ClusterIssuer that cert-manager needs before it can issue any certificate. Supports Let's Encrypt over HTTP-01, or DNS-01 with Route53 and Cloudflare for wildcard certificates. https://cert-manager.io/docs/configuration/acme/
category: Infrastructure
tags:
  - cluster-level
  - networking
  - tls
  - dns
editable: true
fields:
  - name: issuer_name
    description: Name of the ClusterIssuer. Workloads reference this name in their tls_issuer field.
    required: true
    default: letsencrypt-prod
    type: string
  - name: email
    description: Contact address registered with the ACME account, used by Let's Encrypt for account and policy notices. It no longer sends expiry warnings, cert-manager renews automatically.
    required: true
    type: string
  - name: acme_server
    description: ACME directory to register against. Use staging while testing, it issues untrusted certificates but has far higher rate limits.
    required: true
    default: https://acme-v02.api.letsencrypt.org/directory
    type: select
    options:
      - https://acme-v02.api.letsencrypt.org/directory
      - https://acme-staging-v02.api.letsencrypt.org/directory
  - name: solver
    description: How domain ownership is proven. http01 needs the hostname to already resolve to this cluster. dns01 writes a TXT record instead and is the only option that can issue wildcard certificates.
    required: true
    default: http01
    type: select
    options:
      - http01
      - dns01
  - name: ingress_class
    description: Ingress class used to serve the HTTP-01 challenge. Must match the class Orion routes through.
    required: false
    default: nginx
    type: string
  - name: dns_provider
    description: DNS provider used for the dns01 challenge.
    required: false
    default: cloudflare
    type: select
    options:
      - cloudflare
      - route53
  - name: secret_namespace
    description: Namespace the credential Secret is created in. A ClusterIssuer's Secret references carry no namespace, so cert-manager only reads them from the namespace it runs in. Leave at cert-manager unless cert-manager was installed somewhere else.
    required: false
    default: cert-manager
    type: string
  - name: secret_name
    description: Name of an existing Secret holding the DNS provider credential, in secret_namespace. This plugin does not create the Secret, it must be created with kubectl first (see the plugin README). Required for Cloudflare. For Route53, leave empty to use ambient credentials such as IRSA.
    required: false
    type: string
  - name: secret_key
    description: Name of the key inside that Secret, for example api-token. This is only a key name, never the token itself, which lives in the Secret. Route53 reads the fixed key names aws_access_key_id and aws_secret_access_key, so this is only used for Cloudflare.
    required: false
    type: string
  - name: aws_hosted_zone_id
    description: Route53 hosted zone id. Leave empty to let cert-manager discover the zone.
    required: false
    type: string
