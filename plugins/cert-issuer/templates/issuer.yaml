{{- if and (eq .Values.solver "dns01") (eq .Values.dns_provider "cloudflare") }}
{{- if not .Values.secret_name }}
{{- fail (printf "the cloudflare dns01 solver needs an API token - create a Secret in the %s namespace and set secret_name and secret_key (see the plugin README)" .Values.secret_namespace) }}
{{- end }}
{{- if not .Values.secret_key }}
{{- fail "secret_key is empty - name the key inside the Secret that holds the Cloudflare API token (see the plugin README)" }}
{{- end }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuer_name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: {{ .Values.acme_server }}
    email: {{ .Values.email }}
    privateKeySecretRef:
      name: {{ .Values.issuer_name }}-account-key
    solvers:
      {{- if eq .Values.solver "http01" }}
      - http01:
          ingress:
            class: {{ .Values.ingress_class }}
      {{- else if eq .Values.dns_provider "cloudflare" }}
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .Values.secret_name }}
              key: {{ .Values.secret_key }}
      {{- else }}
      - dns01:
          route53:
            region: us-east-1
            {{- if .Values.aws_hosted_zone_id }}
            hostedZoneID: {{ .Values.aws_hosted_zone_id }}
            {{- end }}
            {{- if .Values.secret_name }}
            accessKeyIDSecretRef:
              name: {{ .Values.secret_name }}
              key: aws_access_key_id
            secretAccessKeySecretRef:
              name: {{ .Values.secret_name }}
              key: aws_secret_access_key
            {{- end }}
      {{- end }}
