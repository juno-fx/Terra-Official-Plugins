apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-console
  labels:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: {{ .Values.name }}-console
  template:
    metadata:
      labels:
        app: {{ .Values.name }}-console
    spec:
      serviceAccountName: {{ .Values.name }}-console
      containers:
        - name: nginx
          image: "{{ .Values.nginx_registry }}/{{ .Values.nginx_repo }}:{{ .Values.nginx_tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/nginx.conf
              subPath: nginx.conf
        # The image's built-in nginx on 8080 is unused; the NetworkPolicy only
        # admits the sidecar port.
        - name: kubevirt-console
          image: junoinnovations/kubevirt-console:unstable
          env:
            - name: KUBEVIRT_VM
              value: "{{ .Values.name }}"
      volumes:
        - name: nginx-config
          configMap:
            name: {{ .Values.name }}-console-nginx