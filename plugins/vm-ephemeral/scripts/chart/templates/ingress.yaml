apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-ingress
  labels:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
  annotations:
    kuiper.juno-innovations.com/ingress-extras: "/{{ .Release.Namespace }}/kubevirt/{{ .Values.name }}/vnc.html?keep_device_awake=true&reconnect=5000&autoconnect=true&resize=scale"
spec:
  # Kuiper >= 4.8.0 overwrites this with the launching namespace's IngressClass.
  # nginx is the fallback for older deployments;
  ingressClassName: nginx
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: "/{{ .Release.Namespace }}/kubevirt/{{ .Values.name }}"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-console
                port:
                  number: 8082
