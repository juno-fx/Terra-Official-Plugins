{{ range .Values.ports }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Values.name }}-port-{{ .name }}
  labels:
      kuiper.juno-innovations.com/kuiper-instance: {{ $.Values.name }}
spec:
  type: {{ .type }}
  selector:
    kuiper.juno-innovations.com/vm-instance: {{ $.Values.name }}
  ports:
    - name: {{ .name }}
      protocol: {{ .protocol }}
      port: {{ .service_port }}
      targetPort: {{ .vm_port }}
---
{{ end }}
