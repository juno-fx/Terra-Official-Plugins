apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-console-nginx
  labels:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
data:
  # Mounted over /src/nginx.conf in the console container. The image's entrypoint
  # copies that file to /etc/nginx/nginx.conf on start, so this replaces the config
  # baked into junoinnovations/kubevirt-console, which serves the pre-namespace path
  # only. Nothing rewrites the ingress path, so these locations must match it exactly.
  nginx.conf: |
    events {
    }

    http {
      server {
        listen 8080 default_server;

        location /{{ .Release.Namespace }}/kubevirt-console/{{ .Values.name }}/ {
          proxy_pass http://127.0.0.1:8081/;
        }

        location /{{ .Release.Namespace }}/kubevirt-console/{{ .Values.name }}/websockify {
          proxy_pass http://127.0.0.1:8081/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "Upgrade";
          proxy_set_header Host $host;
        }
      }
    }
