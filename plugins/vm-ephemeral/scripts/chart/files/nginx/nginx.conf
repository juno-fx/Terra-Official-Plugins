# Sidecar config, mounted as /etc/nginx/conf.d/nginx.conf. Listens on 8082
# because the kubevirt-console image runs its own nginx on 8080; this sidecar
# enforces the Hubble login and proxies straight to noVNC/websockify on 8081.
# Nothing rewrites the ingress path, so these locations must match it exactly.
server {
    listen 8082;
    listen [::]:8082;
    client_max_body_size 0;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /{{ .Release.Namespace }}/kubevirt/{{ .Values.name }} {
        rewrite ^ /{{ .Release.Namespace }}/kubevirt/{{ .Values.name }}/ last;
    }

    # noVNC static files. The trailing slash on proxy_pass strips the prefix.
    location /{{ .Release.Namespace }}/kubevirt/{{ .Values.name }}/ {
        auth_request /auth;
        proxy_pass http://127.0.0.1:8081/;
    }

    # VNC WebSocket. Long timeouts so an idle console is not dropped.
    # Any proxy_set_header here drops the server-level ones, so Host is repeated.
    location /{{ .Release.Namespace }}/kubevirt/{{ .Values.name }}/websockify {
        auth_request /auth;
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 43200s;
        proxy_send_timeout 43200s;
    }

    location = /auth {
        internal;
        proxy_pass http://hubble.{{ .Release.Namespace }}.svc.cluster.local:3000/api/auth-workstation/{{ .Values.name }}/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
}
