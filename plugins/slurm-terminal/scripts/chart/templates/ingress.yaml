apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-slurm-terminal
  annotations:
    kubernetes.io/ingress.class: nginx
    # Always authenticated. This terminal is a gateway to the Slurm cluster, so
    # there is no configuration that makes exposing it unauthenticated sensible.
    nginx.ingress.kubernetes.io/auth-url: "http://hubble.{{ .Release.Namespace }}.svc.cluster.local:3000/api/auth-workstation/{{ .Values.name }}/"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: "/slurm/{{ .Values.name }}"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-slurm-terminal
                port:
                  number: 3001
