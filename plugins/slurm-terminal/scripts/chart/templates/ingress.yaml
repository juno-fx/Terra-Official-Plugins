apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-slurm-terminal
spec:
  # Kuiper >= 4.8.0 overwrites this with the launching namespace's IngressClass.
  # nginx is the fallback for older deployments;
  ingressClassName: nginx
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: "/{{ .Release.Namespace }}/slurm/{{ .Values.name }}"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-slurm-terminal
                port:
                  number: 8080
