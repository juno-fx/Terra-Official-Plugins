apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-network-policy
  labels:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
spec:
  podSelector:
    matchLabels:
      kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
  policyTypes:
    - Ingress
    - Egress
  # Only the nginx sidecar port is reachable. It enforces the Hubble login itself,
  # so traffic is accepted from any ingress controller (ingress-nginx, Traefik, ...)
  # without knowing its namespace. Wetty's own port (3000) stays blocked.
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # Cluster DNS, to resolve the login node Service.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Hubble, in this namespace, for the nginx sidecar's auth_request.
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
    # SSH to the Slurm login node — the only outbound connection the terminal makes.
    # Everything else stays denied, so a compromised terminal cannot reach the
    # controller, the compute nodes, or the wider network directly.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.slurmNamespace }}
      ports:
        - protocol: TCP
          port: 22
