apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-network-policy
  labels:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
spec:
  podSelector:
    matchLabels:
      kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Browser traffic, via the ingress controller only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingressNamespace }}
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # Cluster DNS, to resolve the login node Service.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # SSH to the Slurm login node — the only outbound connection this pod makes.
    # Everything else stays denied, so a compromised terminal cannot reach the
    # controller, the compute nodes, or the wider network directly.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.slurmNamespace }}
      ports:
        - protocol: TCP
          port: 22
