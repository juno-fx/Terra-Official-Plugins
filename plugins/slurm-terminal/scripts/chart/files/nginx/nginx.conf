events {}
http {
  server {
    listen 8080;
    listen [::]:8080;
    location /{{ .Release.Namespace }}/slurm/{{ .Values.name }} {
      auth_request /auth;
      proxy_pass http://127.0.0.1:3000/{{ .Release.Namespace }}/slurm/{{ .Values.name }};
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 43200000;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
    }
    location = /auth {
      internal;
      proxy_pass http://hubble.{{ .Release.Namespace }}.svc.cluster.local:3000/api/auth-workstation/{{ .Values.name }}/;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
    }
  }
}
