{{- /*
  Launch-time validation. These fail the render with a readable message rather than
  producing a server that starts and then misbehaves in a way nobody can see.
*/ -}}
{{- if and .Values.node_affinity_value (not .Values.node_affinity_key) }}
{{- fail "node_affinity_value was set without node_affinity_key. The value alone has no effect; set the key, or clear both." }}
{{- end }}
{{- if not .Values.storage_class }}
{{- fail "storage_class is required. Leaving it empty would silently fall back to the cluster default StorageClass." }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Release.Name }}"
  annotations:
    juno-innovations.com/workload: "Server"
    kuiper.juno-innovations.com/connection: "game_port={{ include "v-rising.gamePort" . }},query_port={{ include "v-rising.queryPort" . }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      kuiper.juno-innovations.com/kuiper-instance: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        kuiper.juno-innovations.com/kuiper-instance: "{{ .Release.Name }}"
      annotations:
        # A world flush on shutdown is not something to interrupt for a bin-packing win.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      automountServiceAccountToken: false
      # The server writes its world on shutdown — give Wine time to flush before the kill.
      terminationGracePeriodSeconds: 60

      {{- if .Values.pullSecret }}
      imagePullSecrets:
        - name: "{{ .Values.pullSecret }}"
      {{- end }}

      {{- /* The server is a Windows x86-64 binary under Wine — arm64 nodes cannot run it. */}}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}

      {{- if or .Values.node_affinity_key .Values.selector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  {{- if .Values.node_affinity_key }}
                  - key: {{ .Values.node_affinity_key | quote }}
                    {{- if .Values.node_affinity_value }}
                    operator: In
                    values:
                      - {{ .Values.node_affinity_value | quote }}
                    {{- else }}
                    operator: Exists
                    {{- end }}
                  {{- end }}
                  {{- range .Values.selector }}
                  - key: {{ .key | quote }}
                    operator: In
                    values:
                      - {{ .value | quote }}
                  {{- end }}
      {{- end }}

      containers:
        - name: v-rising
          imagePullPolicy: IfNotPresent
          image: "{{ .Values.registry }}/{{ .Values.repo }}:{{ .Values.tag }}"
          {{- /*
            First boot pulls several GB through SteamCMD, so the container is
            alive long before the server is reachable. Without a startup probe
            the pod reports Ready immediately and the Service endpoint goes live
            pointing at nothing.

            The startup probe checks /proc/net/udp for the port actually bound
            (ports there are hex) rather than merely that a process exists —
            that is precisely the failure that made this server unreachable, so
            it is the condition worth gating on. Liveness uses the cheaper
            process check so a transient probe quirk cannot kill a live world.
            Both /proc/net/udp and `ps` were confirmed present in this image.
          */}}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'grep -qi ":{{ include "v-rising.gamePortHex" . }} " /proc/net/udp'
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'ps aux | grep -q "[V]RisingServer.exe"'
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              memory: "{{ .Values.memory }}"
              cpu: "{{ .Values.cpu }}"
            {{- if or .Values.cpuLimit .Values.memoryLimit }}
            limits:
              {{- if .Values.cpuLimit }}
              cpu: "{{ .Values.cpuLimit }}"
              {{- end }}
              {{- if .Values.memoryLimit }}
              memory: "{{ .Values.memoryLimit }}"
              {{- end }}
            {{- end }}
          ports:
            - containerPort: {{ include "v-rising.gamePort" . }}
              protocol: UDP
              name: game
            - containerPort: {{ include "v-rising.queryPort" . }}
              protocol: UDP
              name: query
          env:
            {{- /*
              SERVERNAME / WORLDNAME / GAMEPORT / QUERYPORT are NOT authoritative.
              The image's /start.sh turns them into CLI flags only (-serverName,
              -saveName, -gamePort, -queryPort) and the V Rising server ignores
              those in favour of ServerHostSettings.json — which persists on the
              data volume, so the values from the very first boot win forever.
              Observed directly: a server launched with "-gamePort 30218" bound
              9876, the value left in the JSON.

              Only HOST_SETTINGS_* reaches the JSON (start.sh pipes them through
              jq on every boot), so every setting that must actually take effect
              is declared that way below. The plain vars are kept because the
              image expects them and they cost nothing.
            */}}
            - name: SERVERNAME
              value: {{ .Values.server_name | quote }}
            - name: WORLDNAME
              value: {{ .Values.world_name | quote }}
            - name: GAMEPORT
              value: {{ include "v-rising.gamePort" . | quote }}
            - name: QUERYPORT
              value: {{ include "v-rising.queryPort" . | quote }}
            {{- /* Authoritative: written into ServerHostSettings.json each boot. */}}
            - name: HOST_SETTINGS_Name
              value: {{ .Values.server_name | quote }}
            - name: HOST_SETTINGS_SaveName
              value: {{ .Values.world_name | quote }}
            - name: HOST_SETTINGS_Port
              value: {{ include "v-rising.gamePort" . | quote }}
            - name: HOST_SETTINGS_QueryPort
              value: {{ include "v-rising.queryPort" . | quote }}
            {{- if .Values.server_password }}
            - name: HOST_SETTINGS_Password
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-credentials"
                  key: HOST_SETTINGS_Password
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: server
              mountPath: /mnt/vrising/server
            - name: persistentdata
              mountPath: /mnt/vrising/persistentdata
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: server
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-server"
        - name: persistentdata
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-data"
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
