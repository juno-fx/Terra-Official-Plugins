{{- /*
  Launch-time validation. These fail the render with a readable message rather than
  producing a server that starts and then misbehaves in a way nobody can see.
*/ -}}
{{- if ne (int .Values.query_port) (add (int .Values.game_port) 1) }}
{{- fail (printf "query_port must be game_port + 1 (got game_port=%v, query_port=%v). V Rising will not appear in the server browser otherwise." .Values.game_port .Values.query_port) }}
{{- end }}
{{- if and .Values.rcon_enabled (not .Values.rcon_password) }}
{{- fail "rcon_enabled is true but rcon_password is empty. Set a password or disable RCON — the admin console would otherwise be exposed with no credential of your choosing." }}
{{- end }}
{{- if and .Values.node_affinity_value (not .Values.node_affinity_key) }}
{{- fail "node_affinity_value was set without node_affinity_key. The value alone has no effect; set the key, or clear both." }}
{{- end }}
{{- if not .Values.storage_class }}
{{- fail "storage_class is required. Leaving it empty would silently fall back to the cluster default StorageClass." }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Release.Name }}"
  annotations:
    juno-innovations.com/workload: "Server"
    {{- /*
      Report the port a player actually dials. With NodePort that is the nodePort, which
      only equals game_port when the admin pins them to match (see README).
    */}}
    {{- $gp := .Values.game_port }}
    {{- $qp := .Values.query_port }}
    {{- if eq .Values.service_type "NodePort" }}
    {{- $gp = .Values.game_node_port | default "auto-assigned" }}
    {{- $qp = .Values.query_node_port | default "auto-assigned" }}
    {{- end }}
    kuiper.juno-innovations.com/connection: "game_port={{ $gp }},query_port={{ $qp }}{{ if .Values.rcon_enabled }},rcon_port=25575{{ end }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      kuiper.juno-innovations.com/kuiper-instance: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        kuiper.juno-innovations.com/kuiper-instance: "{{ .Release.Name }}"
      annotations:
        # A world flush on shutdown is not something to interrupt for a bin-packing win.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      automountServiceAccountToken: false
      # The server writes its world on shutdown — give Wine time to flush before the kill.
      terminationGracePeriodSeconds: 60

      {{- if .Values.pullSecret }}
      imagePullSecrets:
        - name: "{{ .Values.pullSecret }}"
      {{- end }}

      {{- if or .Values.node_affinity_key .Values.selector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  {{- if .Values.node_affinity_key }}
                  - key: {{ .Values.node_affinity_key | quote }}
                    {{- if .Values.node_affinity_value }}
                    operator: In
                    values:
                      - {{ .Values.node_affinity_value | quote }}
                    {{- else }}
                    operator: Exists
                    {{- end }}
                  {{- end }}
                  {{- range .Values.selector }}
                  - key: {{ .key | quote }}
                    operator: In
                    values:
                      - {{ .value | quote }}
                  {{- end }}
      {{- end }}

      containers:
        - name: v-rising
          imagePullPolicy: IfNotPresent
          image: "{{ .Values.registry }}/{{ .Values.repo }}:{{ .Values.tag }}"
          resources:
            requests:
              memory: "{{ .Values.memory }}"
              cpu: "{{ .Values.cpu }}"
            {{- if or .Values.cpuLimit .Values.memoryLimit }}
            limits:
              {{- if .Values.cpuLimit }}
              cpu: "{{ .Values.cpuLimit }}"
              {{- end }}
              {{- if .Values.memoryLimit }}
              memory: "{{ .Values.memoryLimit }}"
              {{- end }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.game_port }}
              protocol: UDP
              name: game
            - containerPort: {{ .Values.query_port }}
              protocol: UDP
              name: query
            {{- if .Values.rcon_enabled }}
            - containerPort: 25575
              protocol: TCP
              name: rcon
            {{- end }}
          env:
            - name: SERVERNAME
              value: {{ .Values.server_name | quote }}
            - name: WORLDNAME
              value: {{ .Values.world_name | quote }}
            - name: GAMEPORT
              value: {{ .Values.game_port | quote }}
            - name: QUERYPORT
              value: {{ .Values.query_port | quote }}
            {{- if .Values.server_password }}
            - name: HOST_SETTINGS_Password
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-credentials"
                  key: HOST_SETTINGS_Password
            {{- end }}
            {{- if .Values.rcon_enabled }}
            - name: HOST_SETTINGS_Rcon_Enabled
              value: "true"
            - name: HOST_SETTINGS_Rcon_Port
              value: "25575"
            {{- if .Values.rcon_password }}
            - name: HOST_SETTINGS_Rcon_Password
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-credentials"
                  key: HOST_SETTINGS_Rcon_Password
            {{- end }}
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: server
              mountPath: /mnt/vrising/server
            - name: persistentdata
              mountPath: /mnt/vrising/persistentdata
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: server
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-server"
        - name: persistentdata
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-data"
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
