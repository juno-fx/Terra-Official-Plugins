apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Release.Name }}"
  annotations:
    juno-innovations.com/workload: "Server"
    kuiper.juno-innovations.com/connection: "game_port={{ .Values.game_port }},query_port={{ .Values.query_port }}{{ if .Values.rcon_enabled }},rcon_port=25575{{ end }}"
spec:
  replicas: 1
  serviceName: "{{ .Release.Name }}-game"
  selector:
    matchLabels:
      kuiper.juno-innovations.com/kuiper-instance: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        kuiper.juno-innovations.com/kuiper-instance: "{{ .Release.Name }}"
    spec:
      automountServiceAccountToken: false
      # The server writes its world on shutdown — give Wine time to flush before the kill.
      terminationGracePeriodSeconds: 60

      {{- if .Values.pullSecret }}
      imagePullSecrets:
        - name: "{{ .Values.pullSecret }}"
      {{- end }}

      {{- if or .Values.node_affinity_key .Values.selector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  {{- if .Values.node_affinity_key }}
                  - key: {{ .Values.node_affinity_key | quote }}
                    {{- if .Values.node_affinity_value }}
                    operator: In
                    values:
                      - {{ .Values.node_affinity_value | quote }}
                    {{- else }}
                    operator: Exists
                    {{- end }}
                  {{- end }}
                  {{- range .Values.selector }}
                  - key: {{ .key | quote }}
                    operator: In
                    values:
                      - {{ .value | quote }}
                  {{- end }}
      {{- end }}

      containers:
        - name: v-rising
          imagePullPolicy: IfNotPresent
          image: "{{ .Values.registry }}/{{ .Values.repo }}:{{ .Values.tag }}"
          resources:
            requests:
              memory: "{{ .Values.memory }}"
              cpu: "{{ .Values.cpu }}"
            {{- if or .Values.cpuLimit .Values.memoryLimit }}
            limits:
              {{- if .Values.cpuLimit }}
              cpu: "{{ .Values.cpuLimit }}"
              {{- end }}
              {{- if .Values.memoryLimit }}
              memory: "{{ .Values.memoryLimit }}"
              {{- end }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.game_port }}
              protocol: UDP
              name: game
            - containerPort: {{ .Values.query_port }}
              protocol: UDP
              name: query
            {{- if .Values.rcon_enabled }}
            - containerPort: 25575
              protocol: TCP
              name: rcon
            {{- end }}
          env:
            - name: SERVERNAME
              value: "{{ .Values.server_name }}"
            - name: WORLDNAME
              value: "{{ .Values.world_name }}"
            - name: GAMEPORT
              value: "{{ .Values.game_port }}"
            - name: QUERYPORT
              value: "{{ .Values.query_port }}"
            {{- if .Values.rcon_enabled }}
            - name: HOST_SETTINGS_Rcon_Enabled
              value: "true"
            - name: HOST_SETTINGS_Rcon_Port
              value: "25575"
            {{- if .Values.rcon_password }}
            - name: HOST_SETTINGS_Rcon_Password
              value: "{{ .Values.rcon_password }}"
            {{- end }}
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}
          volumeMounts:
            - name: server
              mountPath: /mnt/vrising/server
            - name: persistentdata
              mountPath: /mnt/vrising/persistentdata
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: server
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-server"
        - name: persistentdata
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-data"
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
