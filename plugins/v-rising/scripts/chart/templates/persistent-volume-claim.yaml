apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ .Release.Name }}-server"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage_class | quote }}
  resources:
    requests:
      storage: {{ .Values.server_storage_size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ .Release.Name }}-data"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage_class | quote }}
  resources:
    requests:
      storage: {{ .Values.data_storage_size }}
