{{- /*
  Game servers listen on raw UDP — the Service carries the traffic directly.
  Do NOT add an ingress for game traffic: nginx ingress is HTTP/HTTPS only and
  cannot proxy game packets.

  NodePort pairs are auto-derived from the instance name so game/query stay
  adjacent (N / N+1). See _helpers.tpl for why.
*/ -}}
{{- $autoNP := include "v-rising.autoNodePort" . | int }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-game"
spec:
  type: {{ .Values.service_type }}
  selector:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Release.Name }}"
  ports:
    - name: game
      port: {{ include "v-rising.gamePort" . }}
      targetPort: game
      protocol: UDP
      {{- if eq .Values.service_type "NodePort" }}
      nodePort: {{ $autoNP }}
      {{- end }}
    - name: query
      port: {{ include "v-rising.queryPort" . }}
      targetPort: query
      protocol: UDP
      {{- if eq .Values.service_type "NodePort" }}
      nodePort: {{ add $autoNP 1 }}
      {{- end }}
