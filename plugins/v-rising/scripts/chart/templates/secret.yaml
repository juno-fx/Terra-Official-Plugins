{{- if or .Values.server_password (and .Values.rcon_enabled .Values.rcon_password) }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-credentials"
type: Opaque
stringData:
  {{- if .Values.server_password }}
  HOST_SETTINGS_Password: {{ .Values.server_password | quote }}
  {{- end }}
  {{- if and .Values.rcon_enabled .Values.rcon_password }}
  HOST_SETTINGS_Rcon_Password: {{ .Values.rcon_password | quote }}
  {{- end }}
{{- end }}
