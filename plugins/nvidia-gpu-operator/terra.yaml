resource_id: nvidia-gpu-operator
name: NVIDIA GPU Operator
icon: https://www.nvidia.com/content/nvidiaGDC/us/en_US/about-nvidia/legal-info/logo-brand-usage/_jcr_content/root/responsivegrid/nv_container_392921705/nv_container/nv_image.coreimg.100.410.png/1703060329053/nvidia-logo-vert.png
description: |
  Enable GPU acceleration for compute workloads on NVIDIA GPUs. https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/gpu-sharing.html
category: Hardware
tags:
  - gpu
  - nvidia
  - time-slicing
  - vm-passthrough
  - operator
  - cluster-level
editable: true
fields:
  - name: version
    description: Version of the GPU Operator to install.
    required: true
    type: select
    default: v25.10.1
    options:
      - v25.10.1
      - v25.3.4
  - name: helm_repo
    description: Helm repository URL for the NVIDIA GPU Operator chart.
    required: true
    type: string
    default: "https://helm.ngc.nvidia.com/nvidia"
  - name: slice_count
    description: |
      Number of time-slices per GPU. 4 means each GPU shows up as 4 nvidia.com/gpu
      resources; 1 turns time-slicing off. Ignored while device_plugin is off.
    required: true
    default: 4
    type: int
  - name: install_driver
    description: |
      Install the NVIDIA driver on GPU nodes. Turn off when the nodes already have it
      (EKS NVIDIA AMIs, or a driver installed on the host).
    required: false
    default: true
    type: boolean
  - name: open_kernel_modules
    description: |
      Force NVIDIA's open-source kernel modules (Turing and newer GPUs only). Off lets the
      operator choose, which already picks them where they are required (DGX Spark, B200).
      Only applies while install_driver is on.
    required: false
    default: false
    type: boolean
  - name: install_toolkit
    description: |
      Install the NVIDIA container toolkit on GPU nodes. Turn off when the nodes already
      have it (EKS NVIDIA AMIs); the plugin then creates the nvidia RuntimeClass itself.
    required: false
    default: true
    type: boolean
  - name: k3s
    description: |
      Point the container toolkit at the k3s containerd socket and config. Set to false on
      EKS and other non-k3s clusters. Only applies while install_toolkit is on.
    required: false
    default: true
    type: boolean
  - name: install_crds
    description: |
      Manage the driver through NVIDIADriver resources instead of the ClusterPolicy. Needed
      only when node pools require different drivers, e.g. old and new GPUs that no single
      driver version supports. Does not install CRDs; those always ship with the chart.
      Turning it on restarts the driver pods. Leave off otherwise.
    required: false
    default: false
    type: boolean
  - name: install_nfd
    description: |
      Install Node Feature Discovery (NFD) with the operator. NFD labels the GPU nodes,
      which is how the operator finds them. A cluster should have only one NFD install: if
      the AMD GPU Operator plugin (or anything else) already installs NFD, turn this off.
      If you add the AMD GPU Operator later, leave this on and keep its install_nfd off.
      The plugin that installs NFD must be uninstalled last.
    required: false
    default: true
    type: boolean
  - name: device_plugin
    description: |
      Run the operator's own device plugin, which advertises nvidia.com/gpu and applies
      slice_count. Turn off before installing the HAMi plugin, which brings its own.
    required: false
    default: true
    type: boolean
