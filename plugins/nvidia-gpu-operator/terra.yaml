resource_id: nvidia-gpu-operator
name: NVIDIA GPU Operator
icon: https://www.nvidia.com/content/nvidiaGDC/us/en_US/about-nvidia/legal-info/logo-brand-usage/_jcr_content/root/responsivegrid/nv_container_392921705/nv_container/nv_image.coreimg.100.410.png/1703060329053/nvidia-logo-vert.png
description: |
  Enable GPU acceleration for compute workloads on NVIDIA GPUs. https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/gpu-sharing.html
category: Hardware
tags:
  - gpu
  - nvidia
  - time-slicing
  - vm-passthrough
  - operator
  - cluster-level
editable: true
fields:
  - name: version
    description: Version of the GPU Operator to install.
    required: true
    type: select
    default: v25.10.1
    options:
      - v25.10.1
      - v25.3.4
  - name: helm_repo
    description: Helm repository URL for the NVIDIA GPU Operator chart.
    required: true
    type: string
    default: "https://helm.ngc.nvidia.com/nvidia"
  - name: install_driver
    description: |
      Run the operator's driver DaemonSet to install the NVIDIA kernel driver on GPU nodes.
      Turn off when the node image already ships the driver, e.g. EKS AL2023 or Bottlerocket
      NVIDIA AMIs or hosts with a distro-installed driver. The operator then validates the
      host driver instead of installing one; a second driver install on such nodes fails.
    required: false
    default: true
    type: boolean
  - name: open_kernel_modules
    description: |
      Install NVIDIA's open-source GPU kernel modules instead of the proprietary ones.
      Required on Blackwell and newer (DGX Spark GB10, B200); supported on Turing and newer
      data-centre GPUs; older cards need the proprietary modules. Only applies while
      install_driver is on.
    required: false
    default: false
    type: boolean
  - name: install_toolkit
    description: |
      Run the operator's container-toolkit DaemonSet to install nvidia-container-toolkit and
      register the nvidia containerd runtime. Turn off when the node image already ships it
      (EKS NVIDIA AMIs). This plugin then creates the nvidia RuntimeClass itself, since the
      operator only creates it alongside its toolkit. Off disables the k3s socket override.
    required: false
    default: true
    type: boolean
  - name: k3s
    description: |
      When installing in a k3s cluster, the NVIDIA GPU Operator needs to be configured 
      to point to the correct containerd socket. The path is: /run/k3s/containerd/containerd.sock. 
      Setting this to true will configure the NVIDIA GPU Operator to use this socket path for 
      containerd, which is necessary for it to function properly in a k3s environment.
      Only applies while install_toolkit is on; set false on EKS and other non-k3s clusters.
    required: false
    default: true
    type: boolean
  - name: install_crds
    description: |
      Let the operator manage its optional CRDs: installs the NVIDIADriver CRD and lets the
      operator upgrade and clean up its CRDs on upgrade and uninstall. The ClusterPolicy CRD
      the operator needs is always installed with the chart. Leave off when another GPU
      Operator release in the cluster already owns these CRDs.
    required: false
    default: false
    type: boolean
  - name: slice_count
    description: |
      Number of time-slices to create for each GPU. 4 means each GPU shows up as 4
      schedulable nvidia.com/gpu resources. 1 turns time-slicing off (whole GPUs). Ignored
      while device_plugin is off, so it needs no change when the HAMi GPU Sharing plugin
      takes over slicing.
    required: true
    default: 4
    type: int
  - name: device_plugin
    description: |
      Run the GPU Operator's own device plugin, which advertises nvidia.com/gpu and applies
      the slice_count time-slicing. Turn this off before installing the HAMi GPU Sharing
      plugin: HAMi brings its own device plugin, and two device plugins on one node fight
      over nvidia.com/gpu. Drivers, the container toolkit, NFD and DCGM keep running either way.
    required: false
    default: true
    type: boolean
