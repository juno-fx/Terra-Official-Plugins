{{- if not .Values.install_toolkit }}
# Created when the toolkit is pre-installed on the node image. HAMi and the workload charts
# set runtimeClassName: nvidia. The handler must match the runtime name in the node's
# containerd config; EKS NVIDIA AMIs register it as "nvidia".
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
{{- end }}
