apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-nvidia-gpu-operator
  namespace: {{ .Release.Namespace }}
  finalizers:
    # Without this, deleting the Application leaves the operator running.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Name }}-gpu-operator
  sources:
    - repoURL: {{ .Values.helm_repo }}
      chart: gpu-operator
      targetRevision: {{ .Values.version }}
      helm:
        releaseName: {{ .Release.Name }}-nvidia-gpu-operator
        values: |
          # Short NFD name. With the default name, NFD's post-delete "-prune" Job goes over
          # the 63-character label limit and the uninstall hangs in Argo CD.
          node-feature-discovery:
            fullnameOverride: {{ .Release.Name }}-nfd
          toolkit:
            # Off when the node image ships the toolkit (EKS NVIDIA AMIs).
            # runtimeclass.yaml then creates the nvidia RuntimeClass.
            enabled: {{ .Values.install_toolkit }}
            {{ if and .Values.k3s .Values.install_toolkit }}
            env:
              - name: CONTAINERD_SOCKET
                value: /run/k3s/containerd/containerd.sock
              - name: CONTAINERD_CONFIG
                value: /var/lib/rancher/k3s/agent/etc/containerd/config.toml
            {{ end }}
          driver:
            # Off when the node image ships the driver.
            enabled: {{ .Values.install_driver }}
            # "auto" lets the operator choose, "open" forces the open modules. Replaces
            # useOpenKernelModules, which the chart no longer reads.
            kernelModuleType: {{ ternary "open" "auto" .Values.open_kernel_modules }}
            nvidiaDriverCRD:
              # Manages the driver through an NVIDIADriver resource instead of the
              # ClusterPolicy. Skipped while install_driver is off.
              enabled: {{ and .Values.install_crds .Values.install_driver }}
          operator:
            cleanupCRD: {{ .Values.install_crds }}
            upgradeCRD: {{ .Values.install_crds }}
          sandboxWorkloads:
            enabled: true
            defaultWorkload: container
          devicePlugin:
            # Off when the HAMi plugin provides the device plugin instead.
            enabled: {{ .Values.device_plugin }}
            config:
              name: device-plugin-config
              create: true
              default: default
              data:
                default: |-
                  version: v1
                  flags:
                    migStrategy: none
                  {{- /* No time-slicing block when slice_count is 1 (the device plugin rejects
                       replicas < 2) or when the device plugin is off (GPU Feature Discovery
                       would still label the nodes as sliced). */}}
                  {{- if and (gt (int .Values.slice_count) 1) .Values.device_plugin }}
                  sharing:
                    timeSlicing:
                      renameByDefault: false
                      failRequestsGreaterThanOne: false
                      resources:
                        - name: nvidia.com/gpu
                          replicas: {{ .Values.slice_count }}
                  {{- end }}
          nfd:
            # Off when something else already installs NFD (e.g. the AMD GPU Operator plugin).
            enabled: {{ .Values.install_nfd }}
          dcgm:
            enabled: {{ .Values.dcgm_enabled }}
          {{- /* Only when the Prometheus Operator CRDs exist (kube-prometheus-stack plugin).
               Without them the operator reports the DCGM exporter as not ready. Argo CD
               re-renders on refresh, so installing Prometheus later is enough. */}}
          {{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
          dcgmExporter:
            serviceMonitor:
              enabled: true
              {{- with .Values.prometheus_release_label }}
              additionalLabels:
                release: {{ . | quote }}
              {{- end }}
          {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
