apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-nvidia-gpu-operator
  namespace: {{ .Release.Namespace }}
  finalizers:
    # Without this Argo CD deletes the Application object only and orphans the
    # operator, its operands and the ClusterPolicy.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Name }}-gpu-operator
  sources:
    - repoURL: {{ .Values.helm_repo }}
      chart: gpu-operator
      targetRevision: {{ .Values.version }}
      helm:
        releaseName: {{ .Release.Name }}-nvidia-gpu-operator
        values: |
          # The release name above is long. The NFD subchart truncates its fullname to 63
          # characters and then appends "-prune" for its post-delete hook Job, pushing the
          # Job's label past the 63-character limit. The API server rejects the Job, Argo
          # retries forever and the uninstall never finishes. A short fixed NFD name keeps
          # every derived name under the limit.
          node-feature-discovery:
            fullnameOverride: {{ .Release.Name }}-nfd
          toolkit:
            # Off when the node image ships nvidia-container-toolkit (EKS NVIDIA AMIs).
            # runtimeclass.yaml then provides the nvidia RuntimeClass the operator skips.
            enabled: {{ .Values.install_toolkit }}
            {{ if and .Values.k3s .Values.install_toolkit }}
            env:
              - name: CONTAINERD_SOCKET
                value: /run/k3s/containerd/containerd.sock
              - name: CONTAINERD_CONFIG
                value: /var/lib/rancher/k3s/agent/etc/containerd/config.toml
            {{ end }}
          driver:
            # Off when the node image ships the driver; the validator then checks the host
            # driver instead of the DaemonSet installing a second one.
            enabled: {{ .Values.install_driver }}
            useOpenKernelModules: {{ .Values.open_kernel_modules }}
            nvidiaDriverCRD:
              enabled: {{ .Values.install_crds }}
          operator:
            cleanupCRD: {{ .Values.install_crds }}
            upgradeCRD: {{ .Values.install_crds }}
          sandboxWorkloads:
            enabled: true
            defaultWorkload: container
          devicePlugin:
            # Off when the HAMi GPU Sharing plugin provides the device plugin instead.
            enabled: {{ .Values.device_plugin }}
            config:
              name: device-plugin-config
              create: true
              default: default
              data:
                default: |-
                  version: v1
                  flags:
                    migStrategy: none
                  {{- if gt (int .Values.slice_count) 1 }}
                  # A slice_count of 1 means no time-slicing; the config parser rejects replicas < 2.
                  sharing:
                    timeSlicing:
                      renameByDefault: false
                      failRequestsGreaterThanOne: false
                      resources:
                        - name: nvidia.com/gpu
                          replicas: {{ .Values.slice_count }}
                  {{- end }}
          nfd:
            enabled: true
          dcgm:
            enabled: {{ .Values.dcgm_enabled }}
          {{- if eq (toString .Values.dcgm_servicemonitor) "true" }}
          dcgmExporter:
            serviceMonitor:
              enabled: true
              {{- with .Values.prometheus_release_label }}
              additionalLabels:
                release: {{ . | quote }}
              {{- end }}
          {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
