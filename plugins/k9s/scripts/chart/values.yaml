name: k9s
user:
nginx_registry: "docker.io"
nginx_repo: "nginx"
nginx_tag: "alpine"
ttyd_port: 7681
group:
cpu: "1"
memory: "1Gi"
cpuLimit: "2"
memoryLimit: "2Gi"
idx: 0
guid: 0
puid: 0
host:
pullSecret:
session:
volumeMounts: []
volumes: []
env:
  - name: JUNO
    value: "true"
selector:
plugins: []
_kuiper:
cluster_access: "readonly-ns"
