apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Release.Name }}"
  labels:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Values.name }}"
  annotations:
    juno-innovations.com/workload: "Terminal"
spec:
  replicas: 1
  selector:
    matchLabels:
      kuiper.juno-innovations.com/kuiper-instance: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        kuiper.juno-innovations.com/kuiper-instance: "{{ .Release.Name }}"
    spec:
      serviceAccountName: "{{ .Values.name }}"
      automountServiceAccountToken: true
      containers:
        - name: k9s
          imagePullPolicy: IfNotPresent
          image: node:lts-bookworm-slim
          command:
            - sh
            - /opt/boot/boot.sh
          resources:
            requests:
              memory: "{{ .Values.memory }}"
              cpu: "{{ .Values.cpu }}"
            {{- if or .Values.cpuLimit .Values.memoryLimit }}
            limits:
              {{- if .Values.cpuLimit }}
              cpu: "{{ .Values.cpuLimit }}"
              {{- end }}
              {{- if .Values.memoryLimit }}
              memory: "{{ .Values.memoryLimit }}"
              {{- end }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.ttyd_port }}
              name: ttyd
          env:
            {{- range .Values.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
            - name: PUID
              value: "{{ .Values.puid }}"
            - name: PGID
              value: "{{ .Values.guid }}"
            - name: USER
              value: "{{ .Values.user }}"
            - name: HOME
              value: "/data"
            - name: JUNO_WORKSTATION
              value: "{{ .Values.name }}"
            # Used by boot.sh to build wetty's base path. nginx forwards the full
            # path without rewriting, so it must match the ingress path exactly.
            - name: NAMESPACE
              value: "{{ .Release.Namespace }}"
          startupProbe:
            tcpSocket:
              port: {{ .Values.ttyd_port }}
            failureThreshold: 150
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: {{ .Values.ttyd_port }}
            failureThreshold: 24
            periodSeconds: 5
          volumeMounts:
            - name: boot
              mountPath: /opt/boot
            - name: kubeconfig
              mountPath: /etc/kubeconfig
              readOnly: true
            - name: tools
              mountPath: /tools
            - name: data
              mountPath: /data
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}
        - name: nginx
          imagePullPolicy: IfNotPresent
          image: "{{ .Values.nginx_registry }}/{{ .Values.nginx_repo }}:{{ .Values.nginx_tag }}"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          ports:
            - containerPort: 8080
              name: proxy
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      nodeSelector:
        beta.kubernetes.io/arch: amd64
      tolerations:
        - key: juno-innovations.com/workstation
          operator: Equal
          value: "true"
          effect: NoSchedule
      volumes:
        - name: nginx-config
          configMap:
            name: "{{ .Values.name }}-nginx"
        - name: boot
          configMap:
            name: "{{ .Release.Name }}-boot"
            defaultMode: 0755
        - name: kubeconfig
          configMap:
            name: "{{ .Release.Name }}-kubeconfig"
        - name: tools
          emptyDir: {}
        - name: data
          emptyDir: {}
        {{- if .Values.volumes }}
        {{- toYaml .Values.volumes | nindent 8 }}
        {{- end }}
