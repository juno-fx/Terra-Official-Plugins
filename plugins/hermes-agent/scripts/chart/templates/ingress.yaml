apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-hermes
spec:
  # Kuiper >= 4.8.0 overwrites this with the launching namespace's IngressClass.
  # nginx is the fallback for older deployments;
  ingressClassName: nginx
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          # Two paths so Hubble lists both endpoints (dashboard + terminal). Both go to
          # the nginx sidecar, which routes /dashboard to the dashboard and the rest to wetty.
          - path: "/{{ .Release.Namespace }}/hermes/{{ .Values.name }}/dashboard"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-hermes
                port:
                  number: 8080
          - path: "/{{ .Release.Namespace }}/hermes/{{ .Values.name }}"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-hermes
                port:
                  number: 8080
