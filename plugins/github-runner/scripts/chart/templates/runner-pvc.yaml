apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ .Release.Name }}-runner-config"
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.runnerStorageClass }}
  storageClassName: {{ .Values.runnerStorageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.runnerStorageSize }}