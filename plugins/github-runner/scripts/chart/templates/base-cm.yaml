apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nested-ci
# NOTE: data keys must stay FLAT -- the Kubernetes API rejects '/' in ConfigMap
# data keys (regex [-._a-zA-Z0-9]+). The nested containers/ layout init.sh
# expects is restored by the volume `items` path mapping in workstation.yaml —
# keep that items list in sync with every key here.
data:
  init.sh: |
{{ .Files.Get "files/init.sh" | indent 4 }}
  policy.json: |
{{ .Files.Get "files/containers/policy.json" | indent 4 }}
  registries.conf: |
{{ .Files.Get "files/containers/registries.conf" | indent 4 }}
  storage.conf: |
{{ .Files.Get "files/containers/storage.conf" | indent 4 }}