resource_id: docker-registry
name: Docker Registry
icon: https://raw.githubusercontent.com/juno-fx/Terra-Official-Plugins/refs/heads/main/plugins/docker-registry/assets/logo.png
description: Self-hosted Docker container registry exposed via NodePort for pushing and pulling images.
category: Development
tags:
  - registry
  - docker
editable: true
fields:
  - name: size
    description: Persistent volume size for registry storage (e.g. "10Gi", "50Gi")
    type: string
    required: true
    default: "10Gi"
  - name: storageClass
    description: StorageClass for the registry PVC (leave empty for cluster default)
    type: string
    required: false