apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-kuiper-config"
  labels:
    kuiper.juno-innovations.com/kuiper-instance: "{{ .Release.Name }}"
data:
  group: |
    admin
  name: |
    {{ .Release.Name }}
  user: |
    {{ .Values.user }}
  type: |
    Server
  label: |
    {{ .Release.Name }}
  icon: |
    https://raw.githubusercontent.com/juno-fx/Terra-Official-Plugins/refs/heads/main/plugins/docker-registry/assets/logo.png