apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.name }}"
spec:
  selector:
    juno-innovations.com/workstation: "{{ .Values.name }}"
  ports:
    {{- if eq .Values.network_mode "ingress-auth" }}
    # Route through the nginx sidecar, which enforces the Hubble login.
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: nginx
    {{- else }}
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP
      name: viewer
    {{- end }}
