apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-terra-metadata"
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Application"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "Go runtime environment — clone, build, and run your application"
  fields: |
    - name: icon
      default: "https://github.com/juno-fx/Terra-Official-Plugins/blob/main/plugins/runtime-go/assets/icon.svg?raw=true"
    - name: registry
      description: "Container registry"
      type: string
      required: true
      default: "docker.io"
    - name: repo
      description: "Image repository"
      type: string
      required: true
      default: "golang"
    - name: tag
      description: "Image tag"
      type: string
      required: true
      default: "1.26"
    - name: git_url
      description: "Git repository URL to clone (leave empty when using source_path). WARNING: any credential embedded in this URL is stored in plaintext in the pod spec and in the workload record, and is readable by anyone with namespace-level read access. Use only short-lived, read-only, single-repository tokens."
      type: string
      required: false
      default: ""
    - name: git_ref
      description: "Git reference (branch, tag, commit)"
      type: string
      required: false
      default: "main"
    - name: source_path
      description: "Path to existing code on disk (alternative to git clone)"
      type: string
      required: false
    - name: build_command
      description: "Build command (e.g. go build -o app .)"
      type: string
      required: false
      default: "go build -o app ."
    - name: run_command
      description: "Command to launch your application"
      type: string
      required: true
      default: "./app"
    - name: port
      description: "Application port"
      type: int
      required: true
      default: 8080
    - name: network_mode
      description: "How to expose the application"
      type: select
      required: true
      default: "ingress-auth"
      options:
        - ingress-auth
        - ingress-noauth
        - clusterip
        - nodeport
    - name: hostname
      description: "Serve the application at its own domain, for example app.example.com, instead of a path on the platform host. Requires network_mode ingress-noauth, since the platform session cookie is not sent to another domain"
      type: string
      required: false
    - name: tls_issuer
      description: "cert-manager ClusterIssuer used to obtain the certificate for that domain, for example letsencrypt-prod"
      type: string
      required: false
    - name: publish_dns
      description: "Annotate the route so the ExternalDNS plugin creates the DNS record for that domain"
      type: boolean
      required: false
      default: false
    - name: gpu
      description: "Attach a GPU"
      type: boolean
      required: true
