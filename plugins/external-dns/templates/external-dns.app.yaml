---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-external-dns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
    - post-delete-finalizer.argocd.argoproj.io
    - post-delete-finalizer.argocd.argoproj.io/cleanup
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: {{ .Values.chart_version }}
      helm:
        releaseName: external-dns
        values: |
          provider:
            name: {{ .Values.provider }}
          policy: {{ .Values.policy }}
          registry: txt
          txtOwnerId: {{ .Values.txt_owner_id | quote }}
          sources:
            {{- range .Values.sources }}
            - {{ . }}
            {{- end }}
          {{- if .Values.domain_filters }}
          domainFilters:
            {{- range splitList "," .Values.domain_filters }}
            - {{ . | trim }}
            {{- end }}
          {{- end }}
          annotationFilter: {{ .Values.annotation_filter | quote }}
          {{- if and (eq .Values.provider "aws") .Values.aws_role_arn }}
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: {{ .Values.aws_role_arn | quote }}
          {{- end }}
          {{- if or (eq .Values.provider "cloudflare") (and (eq .Values.provider "aws") .Values.aws_access_key_id) }}
          env:
            {{- if eq .Values.provider "cloudflare" }}
            - name: CF_API_TOKEN
              {{- if .Values.cloudflare_secret_name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflare_secret_name }}
                  key: {{ .Values.cloudflare_secret_key }}
              {{- else }}
              value: {{ .Values.cloudflare_api_token | quote }}
              {{- end }}
            {{- else }}
            {{- if not .Values.aws_secret_name }}
            {{- fail "aws_access_key_id is set but aws_secret_name is empty - create a Secret holding the secret access key in the external-dns namespace and name it here (see the plugin README)" }}
            {{- end }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.aws_access_key_id | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aws_secret_name }}
                  key: {{ .Values.aws_secret_key }}
            {{- end }}
          {{- end }}
          {{- if .Values.extra_values }}
          {{ .Values.extra_values | nindent 10 }}
          {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
