name: tdk
user:
repo:
tag:
registry:
group:
cpu: "1"
memory: "1Gi"
cpuLimit: null
memoryLimit: null
gpu: false
idx: 0
guid: 0
puid: 0
host:
pullSecret:
session:
volumeMounts: []
volumes: []
env:
  - name: JUNO
    value: "true"
selector:
plugins: []
_kuiper:
packages: ""
terra_role:
nginx_registry: "docker.io"
nginx_repo: "nginx"
nginx_tag: "latest"
# defaults to 'traefik' (>2.0.0)  or 'ingress-nginx' (when using Orion <2.0.0)
proxy_namespace:
gateway:
  name: orion
  # fallback when gateway_namespace is unset (templates saved before the field existed)
  namespace: argocd
# baked to the Genesis namespace by templates/metadata.yaml at install time
gateway_namespace:
persistence_size: 1Gi
persistence_storage_class: local-path
